name: Apply history mode ownership fix

on:
  push:
    branches:
      - fix/history-mode-duplicate-board
    paths:
      - .github/workflows/agent-history-duplicate-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/history-mode-duplicate-board
          fetch-depth: 0

      - name: Apply focused source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/web/src/completed-matches-view.ts',
              "let mode: 'active' | 'results' = 'active';",
              "let mode: 'active' | 'results' = 'active';\ndocument.body.dataset.viewMode = 'active';"
          )

          replace_once(
              'apps/web/src/completed-matches-view.ts',
              """  const resultsMode = mode === 'results';
  activeList.hidden = resultsMode;
  resultsList.hidden = !resultsMode;
  analysisHeader.hidden = resultsMode;
  seriesHistory.hidden = resultsMode;
  qualityBanner.hidden = resultsMode;
  gameContent.hidden = resultsMode;
  completedDetail.hidden = !resultsMode;

  if (resultsMode) {""",
              """  const resultsMode = mode === 'results';
  const viewMode = resultsMode ? 'match-history' : 'active';
  document.body.dataset.viewMode = viewMode;
  activeList.hidden = resultsMode;
  resultsList.hidden = !resultsMode;
  analysisHeader.hidden = resultsMode;
  seriesHistory.hidden = resultsMode;
  qualityBanner.hidden = resultsMode;
  gameContent.hidden = resultsMode;
  completedDetail.hidden = !resultsMode;
  window.dispatchEvent(new CustomEvent('esports-live:view-mode', {
    detail: { mode: viewMode }
  }));

  if (resultsMode) {"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """interface StoredHistoryState {
  score: [number, number];
  completed: string[];
  winners: Record<string, string>;
}
""",
              """interface StoredHistoryState {
  score: [number, number];
  completed: string[];
  winners: Record<string, string>;
}

type ViewMode = 'active' | 'match-history';
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """let historyController: AbortController | null = null;

const style = document.createElement('style');
style.textContent = `
""",
              """let historyController: AbortController | null = null;
let viewMode: ViewMode = document.body.dataset.viewMode === 'match-history'
  ? 'match-history'
  : 'active';

const style = document.createElement('style');
style.textContent = `
  body[data-view-mode='match-history'] #series-history {
    display: none !important;
  }
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """function renderHistory(seriesId: string): void {
  if (activeSeriesId !== seriesId) return;
""",
              """function renderHistory(seriesId: string): void {
  if (viewMode !== 'active') {
    historyPanel.hidden = true;
    return;
  }
  if (activeSeriesId !== seriesId) return;
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """function showMessage(message: string, warning = false): void {
  analysisHeader.classList.remove('history-summary-active');
""",
              """function showMessage(message: string, warning = false): void {
  if (viewMode !== 'active') {
    historyPanel.hidden = true;
    return;
  }
  analysisHeader.classList.remove('history-summary-active');
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """function scheduleRefresh(seriesId: string): void {
  clearRefreshTimer();
  if (document.hidden) return;
""",
              """function scheduleRefresh(seriesId: string): void {
  clearRefreshTimer();
  if (document.hidden || viewMode !== 'active') return;
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """async function loadHistory(seriesId: string): Promise<void> {
  if (loadingSeriesId === seriesId) return;
""",
              """async function loadHistory(seriesId: string): Promise<void> {
  if (viewMode !== 'active' || loadingSeriesId === seriesId) return;
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """    if (currentRequest === requestId && activeSeriesId === seriesId) {
      loadingSeriesId = null;
      scheduleRefresh(seriesId);
    }
""",
              """    if (currentRequest === requestId && activeSeriesId === seriesId) {
      loadingSeriesId = null;
      if (viewMode === 'active') scheduleRefresh(seriesId);
    }
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """function syncSelection(seriesId: string | null): void {
  if (!seriesId) {
    activeSeriesId = null;
    requestId += 1;
    loadingSeriesId = null;
    clearRefreshTimer();
    historyController?.abort();
    historyController = null;
    resetHistoryPanel();
    return;
  }
  if (seriesId === activeSeriesId) {
    const history = histories.get(seriesId);
    if (history) {
      applyHistoryHeader(history);
      renderHistory(seriesId);
    }
    return;
  }
  activeSeriesId = seriesId;
  requestId += 1;
  loadingSeriesId = null;
  clearRefreshTimer();
  analysisHeader.classList.remove('history-summary-active');
  if (histories.has(seriesId)) renderHistory(seriesId);
  void loadHistory(seriesId);
}
""",
              """function setViewMode(nextMode: ViewMode): void {
  if (viewMode === nextMode) return;
  viewMode = nextMode;

  if (viewMode === 'match-history') {
    requestId += 1;
    loadingSeriesId = null;
    clearRefreshTimer();
    historyController?.abort();
    historyController = null;
    analysisHeader.classList.remove('history-summary-active');
    historyPanel.hidden = true;
    return;
  }

  const seriesId = activeSeriesId;
  if (!seriesId) return;
  if (histories.has(seriesId)) renderHistory(seriesId);
  else void loadHistory(seriesId);
}

function syncSelection(seriesId: string | null): void {
  if (!seriesId) {
    activeSeriesId = null;
    requestId += 1;
    loadingSeriesId = null;
    clearRefreshTimer();
    historyController?.abort();
    historyController = null;
    resetHistoryPanel();
    return;
  }
  if (seriesId === activeSeriesId) {
    if (viewMode === 'active' && histories.has(seriesId)) renderHistory(seriesId);
    return;
  }
  activeSeriesId = seriesId;
  requestId += 1;
  loadingSeriesId = null;
  clearRefreshTimer();
  historyController?.abort();
  historyController = null;
  analysisHeader.classList.remove('history-summary-active');
  historyPanel.hidden = true;
  if (viewMode !== 'active') return;
  if (histories.has(seriesId)) renderHistory(seriesId);
  else void loadHistory(seriesId);
}
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """window.addEventListener('esports-live:selection', event => {
  const selection = (event as CustomEvent<ScheduleEvent>).detail;
  syncSelection(selection.series.id);
});
""",
              """window.addEventListener('esports-live:view-mode', event => {
  const nextMode = (event as CustomEvent<{ mode?: ViewMode }>).detail?.mode;
  if (nextMode === 'active' || nextMode === 'match-history') setViewMode(nextMode);
});

window.addEventListener('esports-live:selection', event => {
  const selection = (event as CustomEvent<ScheduleEvent>).detail;
  syncSelection(selection.series.id);
});
"""
          )

          replace_once(
              'apps/web/src/series-history-results-view.ts',
              """  if (activeSeriesId) void loadHistory(activeSeriesId);
});
""",
              """  if (viewMode === 'active' && activeSeriesId) void loadHistory(activeSeriesId);
});
"""
          )

          replace_once(
              'tests/web/stability.spec.ts',
              """  await page.getByRole('button', { name: 'Open match history' }).click();
  await expect(page.locator('#completed-match-list')).toBeVisible();
  await expect(page.locator('[data-completed-series-id=\"series-completed\"]')).toBeVisible();

  await page.getByRole('button', { name: 'Active' }).click();
  await expect(page.locator('#schedule-list')).toBeVisible();
""",
              """  const matchHistoryMode = page.getByRole('button', { name: 'Open match history' });
  const activeMode = page.getByRole('button', { name: 'Active' });
  const liveHistoryPanel = page.locator('#series-history');
  const completedDetail = page.locator('#completed-match-detail');

  await expect(liveHistoryPanel).toBeVisible();
  await matchHistoryMode.click();
  await expect(page.locator('#completed-match-list')).toBeVisible();
  await expect(page.locator('[data-completed-series-id=\"series-completed\"]')).toBeVisible();
  await expect(completedDetail).toBeVisible();
  await expect(liveHistoryPanel).toBeHidden();
  await page.waitForTimeout(1_200);
  await expect(liveHistoryPanel).toBeHidden();
  await expect(page.locator('h3:visible', { hasText: 'Game results' })).toHaveCount(1);

  await activeMode.click();
  await expect(page.locator('#schedule-list')).toBeVisible();
  await expect(liveHistoryPanel).toBeVisible();

  await matchHistoryMode.click();
  await expect(completedDetail).toBeVisible();
  await page.waitForTimeout(1_200);
  await expect(liveHistoryPanel).toBeHidden();
  await expect(page.locator('h3:visible', { hasText: 'Game results' })).toHaveCount(1);

  await activeMode.click();
  await expect(page.locator('#schedule-list')).toBeVisible();
"""
          )
          PY

      - name: Remove patch workflow
        run: rm .github/workflows/agent-history-duplicate-fix.yml

      - name: Verify patch
        run: git diff --check

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep live history hidden in Match History mode"
          git push origin HEAD:fix/history-mode-duplicate-board
