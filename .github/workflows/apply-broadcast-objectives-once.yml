name: Apply Broadcast Objective UI Once

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/broadcast-objective-icons-no-side-gold
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install image tooling
        run: python -m pip install pillow

      - name: Apply scoreboard objective assets and board cleanup
        run: python scripts/apply-broadcast-objective-icons.py

      - name: Install dependencies
        run: npm install

      - name: Typecheck and test
        run: npm run check

      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: https://esports-live-api.acchtt.workers.dev

      - name: Verify migration
        shell: bash
        run: |
          set -euo pipefail
          for icon in tower dragon baron herald inhibitor; do
            test -s "apps/web/dist/objectives/${icon}.png"
          done
          test ! -e apps/web/dist/objectives/tower-blue.png
          test ! -e apps/web/dist/objectives/tower-red.png
          test ! -e apps/web/dist/objectives/inhibitor-blue.png
          test ! -e apps/web/dist/objectives/inhibitor-red.png
          grep -R "/objectives/tower.png" apps/web/dist/assets/*.js
          grep -R "/objectives/inhibitor.png" apps/web/dist/assets/*.js
          grep -R "team-overview" apps/web/dist/assets/*.js
          python - <<'PY'
          from pathlib import Path
          main = Path('apps/web/src/main.ts').read_text()
          player = Path('apps/web/src/player-board-view.ts').read_text()
          assert 'gold-difference' not in main
          assert 'teamMarkup(stats.blue, blueRef?.imageUrl)' in main
          champion = player.split('.telemetry-champion {', 1)[1].split('}', 1)[0]
          assert 'border: 0;' in champion
          assert 'background: transparent;' in champion
          PY

      - name: Commit migration
        shell: bash
        run: |
          rm .github/workflows/apply-broadcast-objectives-once.yml
          rm scripts/apply-broadcast-objective-icons.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use broadcast objective icons and simplify team boards"
          git push origin HEAD:fix/broadcast-objective-icons-no-side-gold
