name: Apply Eager Data Preload Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/eager-data-preload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Add background loading and completed-game prefetch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          main = 'apps/web/src/main.ts'
          replace_once(
              main,
              "const ACTIVE_SCHEDULE_GRACE_MS = 6 * 60 * 60 * 1_000;\n",
              "const ACTIVE_SCHEDULE_GRACE_MS = 6 * 60 * 60 * 1_000;\n"
              "const COMPLETED_SNAPSHOT_CACHE_MS = 30 * 60 * 1_000;\n"
              "const COMPLETED_PREFETCH_CONCURRENCY = 2;\n"
          )
          replace_once(
              main,
              "let liveClockBaseSeconds: number | null = null;\n",
              "let liveClockBaseSeconds: number | null = null;\n"
              "const completedSnapshotCache = new Map<string, { expiresAt: number; value: LiveSnapshot<LolStats> }>();\n"
              "const completedSnapshotRequests = new Map<string, Promise<LiveSnapshot<LolStats>>>();\n"
          )
          replace_once(
              main,
              "async function api<T>(path: string): Promise<T> {\n"
              "  const response = await fetch(`${API_BASE}${path}`, { cache: 'no-store' });\n"
              "  if (!response.ok) {\n"
              "    const body = await response.json().catch(() => null) as { message?: string } | null;\n"
              "    throw new Error(body?.message ?? `API returned ${response.status}`);\n"
              "  }\n"
              "  return response.json() as Promise<T>;\n"
              "}\n",
              "async function api<T>(path: string): Promise<T> {\n"
              "  const response = await fetch(`${API_BASE}${path}`, { cache: 'no-store' });\n"
              "  if (!response.ok) {\n"
              "    const body = await response.json().catch(() => null) as { message?: string } | null;\n"
              "    throw new Error(body?.message ?? `API returned ${response.status}`);\n"
              "  }\n"
              "  return response.json() as Promise<T>;\n"
              "}\n\n"
              "async function completedSnapshotFor(gameId: string): Promise<LiveSnapshot<LolStats>> {\n"
              "  const cached = completedSnapshotCache.get(gameId);\n"
              "  if (cached && cached.expiresAt > Date.now()) return cached.value;\n"
              "  const pending = completedSnapshotRequests.get(gameId);\n"
              "  if (pending) return pending;\n"
              "  const request = api<LiveSnapshot<LolStats>>(\n"
              "    `/v1/lol/games/${encodeURIComponent(gameId)}/live?prefetch=${Date.now()}`\n"
              "  ).then(snapshot => {\n"
              "    if (snapshot.stats) {\n"
              "      completedSnapshotCache.set(gameId, {\n"
              "        value: snapshot,\n"
              "        expiresAt: Date.now() + COMPLETED_SNAPSHOT_CACHE_MS\n"
              "      });\n"
              "    }\n"
              "    return snapshot;\n"
              "  }).finally(() => completedSnapshotRequests.delete(gameId));\n"
              "  completedSnapshotRequests.set(gameId, request);\n"
              "  return request;\n"
              "}\n\n"
              "function snapshotForGame(game: SeriesGameRef, after: string | null): Promise<LiveSnapshot<LolStats>> {\n"
              "  if (game.state === 'completed' && !after) return completedSnapshotFor(game.id);\n"
              "  const query = after ? `?after=${encodeURIComponent(after)}` : '';\n"
              "  return api<LiveSnapshot<LolStats>>(`/v1/lol/games/${encodeURIComponent(game.id)}/live${query}`);\n"
              "}\n\n"
              "async function prefetchCompletedGames(event: ScheduleEvent): Promise<void> {\n"
              "  const games = event.series.games.filter(game => game.state === 'completed');\n"
              "  if (!games.length) return;\n"
              "  let cursor = 0;\n"
              "  const workers = Array.from(\n"
              "    { length: Math.min(COMPLETED_PREFETCH_CONCURRENCY, games.length) },\n"
              "    async () => {\n"
              "      while (cursor < games.length) {\n"
              "        const game = games[cursor++];\n"
              "        if (!game) continue;\n"
              "        try { await completedSnapshotFor(game.id); } catch {}\n"
              "      }\n"
              "    }\n"
              "  );\n"
              "  await Promise.all(workers);\n"
              "}\n"
          )
          replace_once(
              main,
              "    const query = lastSourceTimestamp ? `?after=${encodeURIComponent(lastSourceTimestamp)}` : '';\n"
              "    const snapshot = await api<LiveSnapshot<LolStats>>(`/v1/lol/games/${encodeURIComponent(game.id)}/live${query}`);\n",
              "    const snapshot = await snapshotForGame(game, lastSourceTimestamp);\n"
          )
          replace_once(
              main,
              "  renderSchedule();\n  renderSeriesHeader(event);\n  if (selectedGameId) void refreshSnapshot();\n",
              "  renderSchedule();\n  renderSeriesHeader(event);\n  void prefetchCompletedGames(event);\n  if (selectedGameId) void refreshSnapshot();\n"
          )
          replace_once(
              main,
              "  renderSeriesHeader(event);\n  if (selectedGameId) void refreshSnapshot();\n  else renderUpcoming(event);\n}\n\nasync function refreshSchedule",
              "  renderSeriesHeader(event);\n  void prefetchCompletedGames(event);\n  if (selectedGameId) void refreshSnapshot();\n  else renderUpcoming(event);\n}\n\nasync function refreshSchedule"
          )
          replace_once(
              main,
              "    renderSchedule();\n    syncSelection();\n    connectionDetail.textContent =",
              "    renderSchedule();\n    syncSelection();\n    void Promise.all(events.slice(0, 3).map(event => prefetchCompletedGames(event)));\n    connectionDetail.textContent ="
          )

          completed = 'apps/web/src/completed-matches-view.ts'
          replace_once(
              completed,
              "const MAX_CONTEXT_CONCURRENCY = 4;\n",
              "const MAX_CONTEXT_CONCURRENCY = 4;\nconst BACKGROUND_RESULTS_DELAY_MS = 250;\n"
          )
          replace_once(
              completed,
              "modeTabs.querySelectorAll<HTMLButtonElement>('[data-mode]').forEach(button => {\n"
              "  button.addEventListener('click', () => setMode(button.dataset.mode === 'results' ? 'results' : 'active'));\n"
              "});\n\n"
              "window.addEventListener('beforeunload', () => {",
              "modeTabs.querySelectorAll<HTMLButtonElement>('[data-mode]').forEach(button => {\n"
              "  button.addEventListener('click', () => setMode(button.dataset.mode === 'results' ? 'results' : 'active'));\n"
              "});\n\n"
              "window.setTimeout(() => void loadCompletedMatches(), BACKGROUND_RESULTS_DELAY_MS);\n\n"
              "window.addEventListener('beforeunload', () => {"
          )

          stats = 'apps/web/src/completed-match-stats-view.ts'
          replace_once(stats, "const MAX_CONCURRENCY = 2;\n", "const MAX_CONCURRENCY = 3;\nconst PREFETCH_MATCH_LIMIT = 2;\n")
          replace_once(
              stats,
              "const contextCache = new Map<string, CachedValue<SeriesContext>>();\n"
              "const snapshotCache = new Map<string, CachedValue<LiveSnapshot<LolStats>>>();\n",
              "const contextCache = new Map<string, CachedValue<SeriesContext>>();\n"
              "const snapshotCache = new Map<string, CachedValue<LiveSnapshot<LolStats>>>();\n"
              "const contextRequests = new Map<string, Promise<SeriesContext>>();\n"
              "const snapshotRequests = new Map<string, Promise<LiveSnapshot<LolStats>>>();\n"
              "const prefetchedSeries = new Set<string>();\n"
          )
          replace_once(
              stats,
              "async function contextFor(seriesId: string): Promise<SeriesContext> {\n"
              "  const cached = contextCache.get(seriesId);\n"
              "  if (cached && cached.expiresAt > Date.now()) return cached.value;\n"
              "  const value = await api<SeriesContext>(`/v1/lol/series/${encodeURIComponent(seriesId)}/context?final=${Date.now()}`);\n"
              "  contextCache.set(seriesId, { value, expiresAt: Date.now() + CACHE_MS });\n"
              "  return value;\n"
              "}\n\n"
              "async function snapshotFor(gameId: string): Promise<LiveSnapshot<LolStats>> {\n"
              "  const cached = snapshotCache.get(gameId);\n"
              "  if (cached && cached.expiresAt > Date.now()) return cached.value;\n"
              "  const value = await api<LiveSnapshot<LolStats>>(`/v1/lol/games/${encodeURIComponent(gameId)}/live?final=${Date.now()}`);\n"
              "  snapshotCache.set(gameId, { value, expiresAt: Date.now() + CACHE_MS });\n"
              "  return value;\n"
              "}\n",
              "async function contextFor(seriesId: string): Promise<SeriesContext> {\n"
              "  const cached = contextCache.get(seriesId);\n"
              "  if (cached && cached.expiresAt > Date.now()) return cached.value;\n"
              "  const pending = contextRequests.get(seriesId);\n"
              "  if (pending) return pending;\n"
              "  const request = api<SeriesContext>(\n"
              "    `/v1/lol/series/${encodeURIComponent(seriesId)}/context?final=${Date.now()}`\n"
              "  ).then(value => {\n"
              "    contextCache.set(seriesId, { value, expiresAt: Date.now() + CACHE_MS });\n"
              "    return value;\n"
              "  }).finally(() => contextRequests.delete(seriesId));\n"
              "  contextRequests.set(seriesId, request);\n"
              "  return request;\n"
              "}\n\n"
              "async function snapshotFor(gameId: string): Promise<LiveSnapshot<LolStats>> {\n"
              "  const cached = snapshotCache.get(gameId);\n"
              "  if (cached && cached.expiresAt > Date.now()) return cached.value;\n"
              "  const pending = snapshotRequests.get(gameId);\n"
              "  if (pending) return pending;\n"
              "  const request = api<LiveSnapshot<LolStats>>(\n"
              "    `/v1/lol/games/${encodeURIComponent(gameId)}/live?final=${Date.now()}`\n"
              "  ).then(value => {\n"
              "    if (value.stats) snapshotCache.set(gameId, { value, expiresAt: Date.now() + CACHE_MS });\n"
              "    return value;\n"
              "  }).finally(() => snapshotRequests.delete(gameId));\n"
              "  snapshotRequests.set(gameId, request);\n"
              "  return request;\n"
              "}\n"
          )
          replace_once(
              stats,
              "function playerMarkup(team: LolTeamState): string {",
              "async function prefetchSeries(seriesId: string): Promise<void> {\n"
              "  if (prefetchedSeries.has(seriesId)) return;\n"
              "  prefetchedSeries.add(seriesId);\n"
              "  try {\n"
              "    const context = await contextFor(seriesId);\n"
              "    const games = context.history?.games.filter(game => game.state === 'completed') ?? [];\n"
              "    await mapWithConcurrency(games, MAX_CONCURRENCY, game => snapshotFor(game.id));\n"
              "  } catch {\n"
              "    prefetchedSeries.delete(seriesId);\n"
              "  }\n"
              "}\n\n"
              "function prefetchVisibleSeries(): void {\n"
              "  const ids = [...resultsList.querySelectorAll<HTMLElement>('[data-completed-series-id]')]\n"
              "    .map(card => card.dataset.completedSeriesId)\n"
              "    .filter((value): value is string => Boolean(value))\n"
              "    .slice(0, PREFETCH_MATCH_LIMIT);\n"
              "  ids.forEach(seriesId => void prefetchSeries(seriesId));\n"
              "}\n\n"
              "function playerMarkup(team: LolTeamState): string {"
          )
          replace_once(
              stats,
              "const observer = new MutationObserver(syncSelectedSeries);\n"
              "observer.observe(resultsList, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });\n"
              "syncSelectedSeries();\n",
              "const observer = new MutationObserver(() => {\n"
              "  syncSelectedSeries();\n"
              "  prefetchVisibleSeries();\n"
              "});\n"
              "observer.observe(resultsList, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });\n"
              "syncSelectedSeries();\n"
              "prefetchVisibleSeries();\n"
          )

          boards = 'apps/web/src/completed-match-player-board-view.ts'
          replace_once(boards, "queue();\n", "void version();\nqueue();\n")
          PY
      - run: npm install --no-package-lock
      - run: npm run check
      - run: npm run build:web
      - name: Commit implementation
        shell: bash
        run: |
          rm -f package-lock.json .github/workflows/apply-eager-data-preload-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/main.ts apps/web/src/completed-matches-view.ts apps/web/src/completed-match-stats-view.ts apps/web/src/completed-match-player-board-view.ts .github/workflows/apply-eager-data-preload-once.yml
          git commit -m "Preload match and game telemetry"
          git push origin HEAD:${{ github.head_ref }}
