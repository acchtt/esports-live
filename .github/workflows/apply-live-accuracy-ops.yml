name: Apply Live Accuracy Ops

on:
  pull_request:
    paths:
      - .github/workflows/apply-live-accuracy-ops.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-telemetry-and-results-data
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply reviewed migration
        run: python scripts/apply-live-accuracy-fix.py
      - name: Validate feature branch
        run: |
          npm install
          npm run check
          npm run build:web
      - name: Commit feature changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapter-lol/src/riot-provider.ts packages/adapter-lol/src/riot-provider.test.ts
          git commit -m "Align Riot live window and detail frames"
          git push origin HEAD:fix/live-telemetry-and-results-data
