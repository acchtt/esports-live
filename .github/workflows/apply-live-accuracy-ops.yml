name: Apply Live Accuracy Ops

on:
  pull_request:
    paths:
      - .github/workflows/apply-live-accuracy-ops.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-telemetry-and-results-data
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply reviewed migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow = Path('.github/workflows/apply-live-accuracy-fix.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(workflow)) if workflow[index].strip() == 'PY')
          exec(compile(dedent('\n'.join(workflow[start:end])), 'apply-live-accuracy-fix.py', 'exec'))
          PY
      - name: Validate feature branch
        run: |
          npm install
          npm run check
          npm run build:web
      - name: Commit feature changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapter-lol/src/riot-provider.ts packages/adapter-lol/src/riot-provider.test.ts
          git commit -m "Align Riot live window and detail frames"
          git push origin HEAD:fix/live-telemetry-and-results-data
