name: Apply Live Data Parity

on:
  pull_request:
    paths:
      - .github/workflows/apply-live-data-parity.yml
      - scripts/apply-live-data-parity.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/live-data-parity-stable-history
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply reviewed migration
        run: python scripts/apply-live-data-parity.py
      - name: Validate source and production build
        run: |
          npm install
          npm run check
          npm run build:web
      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapter-lol/src/riot-provider.ts packages/adapter-lol/src/riot-provider.test.ts apps/web/src/main.ts apps/web/src/styles.css apps/web/src/series-history-view.ts
          git commit -m "Stabilize history and expand live data"
          git push origin HEAD:feature/live-data-parity-stable-history
