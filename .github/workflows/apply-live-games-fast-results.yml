name: Apply Live Games and Fast Results

on:
  pull_request:
    paths:
      - .github/workflows/apply-live-games-fast-results.yml
      - scripts/apply-live-games-fast-results.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/live-games-fast-results-active-list
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply reviewed migration
        run: python scripts/apply-live-games-fast-results.py
      - name: Validate source and web build
        run: |
          npm install
          npm run check
          npm run build:web
      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/adapter-lol/src/riot-context-provider.ts \
            packages/adapter-lol/src/riot-context-provider.test.ts \
            apps/web/src/main.ts \
            apps/web/src/completed-matches-view.ts \
            apps/web/src/styles.css
          git commit -m "Restore live games and speed completed results"
          git push origin HEAD:fix/live-games-fast-results-active-list
