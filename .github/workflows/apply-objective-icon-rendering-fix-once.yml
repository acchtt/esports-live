name: Apply Objective Icon Rendering Fix Once

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/objective-icon-rendering
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: python -m pip install pillow
      - name: Download Riot scoreboard sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 https://raw.communitydragon.org/latest/game/assets/ux/scoreboard/scoreboardatlas.png -o /tmp/scoreboardatlas.png
          curl -fL --retry 4 --retry-delay 3 https://raw.communitydragon.org/latest/game/assets/ux/scoreboard/_riftherald.png -o /tmp/riftherald.png
      - name: Apply objective icon fix
        run: python scripts/apply-objective-icon-rendering-fix.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck and test
        run: npm run check
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: https://esports-live-api.acchtt.workers.dev
      - name: Validate source and built icons
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import io
          import re
          from pathlib import Path

          from PIL import Image

          source = Path('apps/web/src/assets/objectives')
          names = ['tower.png', 'dragon.png', 'baron.png', 'herald.png', 'inhibitor.png']
          for name in names:
              path = source / name
              with Image.open(path) as image:
                  image.load()
                  rgba = image.convert('RGBA')
                  bbox = rgba.getchannel('A').getbbox()
                  assert rgba.size == (64, 64), (name, rgba.size)
                  assert bbox is not None, name
                  assert bbox[0] >= 6 and bbox[1] >= 6 and bbox[2] <= 58 and bbox[3] <= 58, (name, bbox)
                  print(f'{name}: bbox={bbox} bytes={path.stat().st_size}')

          bundle = ''.join(path.read_text(encoding='utf-8') for path in Path('apps/web/dist/assets').glob('*.js'))
          encoded = re.findall(r'data:image/png;base64,([A-Za-z0-9+/=]+)', bundle)
          decoded = 0
          for index, payload in enumerate(encoded):
              with Image.open(io.BytesIO(base64.b64decode(payload))) as image:
                  image.load()
                  if image.size == (64, 64):
                      decoded += 1
                      print(f'inlined-{index}: size={image.size}')

          emitted = []
          for path in Path('apps/web/dist/assets').glob('*.png'):
              with Image.open(path) as image:
                  image.load()
                  if image.size == (64, 64):
                      emitted.append(path.name)

          assert decoded + len(emitted) >= 5, {'inlined': decoded, 'emitted': emitted}
          print('built objective assets', {'inlined': decoded, 'emitted': emitted})
          PY
          ! grep -R '"/objectives/' apps/web/dist/assets/*.js
          grep -R 'fingerprinted-objective-icon-fix' apps/web/dist/assets/*.css
      - name: Commit source-only fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-objective-icon-rendering-fix-once.yml
          rm -f .github/workflows/diagnose-objective-icons-once.yml
          rm -f .github/workflows/diagnose-objective-columns-once.yml
          rm -f scripts/apply-objective-icon-rendering-fix.py
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix objective icon extraction and asset delivery"
          git push origin HEAD:fix/objective-icon-rendering
