name: Apply Role Gold Scoreboard Once

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/role-gold-scoreboard
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Fix strict null narrowing in generator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-role-gold-scoreboard.py')
          text = path.read_text(encoding='utf-8')
          old = "${difference > 0 ? 'Blue' : 'Red'} ${ROLE_LABELS[role]} leads by ${magnitude.toLocaleString()} gold`;"
          new = "${difference > 0 ? 'Blue' : 'Red'} ${ROLE_LABELS[role]} leads by ${Math.abs(difference).toLocaleString()} gold`;"
          if old not in text:
              raise SystemExit('Expected role lead title was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply scoreboard redesign
        run: python scripts/apply-role-gold-scoreboard.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck and test
        run: npm run check
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: https://esports-live-api.acchtt.workers.dev
      - name: Validate production markers
        shell: bash
        run: |
          grep -R 'ROLE MATCHUPS' apps/web/dist/assets/*.js
          grep -R 'Gold difference by position' apps/web/dist/assets/*.js
          grep -R 'role-matchup-row' apps/web/dist/assets/*.js
          grep -R 'role-gold-scoreboard-redesign' apps/web/src/styles.css
          grep -R 'role-edge-track' apps/web/dist/assets/*.css
          ! grep -R 'teamMarkup(stats.blue' apps/web/src/main.ts
      - name: Commit source-only redesign
        shell: bash
        run: |
          rm -f .github/workflows/apply-role-gold-scoreboard-once.yml
          rm -f scripts/apply-role-gold-scoreboard.py
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign live scoreboard around role gold matchups"
          git push origin HEAD:feature/role-gold-scoreboard
