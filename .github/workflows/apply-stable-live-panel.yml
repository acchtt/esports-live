name: Apply Stable Live Panel

on:
  pull_request:
    paths:
      - .github/workflows/apply-stable-live-panel.yml
      - scripts/apply-stable-live-panel.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remove-quality-banner-stable-panel
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply reviewed migration
        run: python scripts/apply-stable-live-panel.py
      - name: Validate source and web build
        run: |
          npm install
          npm run check
          npm run build:web
      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.ts apps/web/index.html
          git commit -m "Keep live panel stable during telemetry gaps"
          git push origin HEAD:fix/remove-quality-banner-stable-panel
