name: Apply Verified Roster Lineups

on:
  pull_request:
    paths:
      - .github/workflows/apply-verified-roster-lineups.yml
      - scripts/apply-verified-roster-lineups.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply verified-lineup migration
        run: python scripts/apply-verified-roster-lineups.py
      - name: Validate provider and web client
        run: |
          npm install
          npm run check
          npm run build:web
      - name: Commit generated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Verified-lineup migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/adapter-lol/src/riot-resolved-provider.ts packages/adapter-lol/src/riot-resolved-provider.test.ts apps/web/src/prematch-view.ts
          git commit -m "Resolve rosters from verified five-player lineups"
          git push origin HEAD:${{ github.head_ref }}
