name: Build Mobile V3 Android Release

on:
  push:
    branches:
      - mobile-v3
  workflow_dispatch:
    inputs:
      version_name:
        description: Play version name, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Play version code
        required: true
        type: string

concurrency:
  group: mobile-v3-android-release
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

env:
  MOBILE_V3_COMMIT_SHA: ${{ github.sha }}
  V3_NATIVE_API_URL: https://mobile-demo-esports-live-api.acchtt.workers.dev
  ARENA_ANDROID_VERSION_NAME: ${{ inputs.version_name || '0.3.2' }}
  ARENA_ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
  ARENA_ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ARENA_ANDROID_RELEASE_KEYSTORE_B64 }}
  ARENA_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ARENA_ANDROID_RELEASE_STORE_PASSWORD }}
  ARENA_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ARENA_ANDROID_RELEASE_KEY_ALIAS }}
  ARENA_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ARENA_ANDROID_RELEASE_KEY_PASSWORD }}

jobs:
  build-release-aab:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Mark Android release pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/mobile-v3-android-release-status.json", JSON.stringify({
              state: "pending",
              context: "esports-live/mobile-v3-android-release",
              description: "ARENA V3 signed release AAB is building",
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/mobile-v3-android-release-status.json

      - name: Check out exact V3 commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release inputs and signing secrets
        shell: bash
        run: |
          [[ "$ARENA_ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code must be a positive integer."; exit 1; }
          [[ "$ARENA_ANDROID_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$ ]] || { echo "version_name must look like 1.0.0."; exit 1; }
          test -n "$ARENA_ANDROID_RELEASE_KEYSTORE_B64" || { echo "Missing secret ARENA_ANDROID_RELEASE_KEYSTORE_B64."; exit 1; }
          test -n "$ARENA_ANDROID_RELEASE_STORE_PASSWORD" || { echo "Missing secret ARENA_ANDROID_RELEASE_STORE_PASSWORD."; exit 1; }
          test -n "$ARENA_ANDROID_RELEASE_KEY_ALIAS" || { echo "Missing secret ARENA_ANDROID_RELEASE_KEY_ALIAS."; exit 1; }
          test -n "$ARENA_ANDROID_RELEASE_KEY_PASSWORD" || { echo "Missing secret ARENA_ANDROID_RELEASE_KEY_PASSWORD."; exit 1; }

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(command -v sdkmanager)"
          fi
          test -n "$sdkmanager_path" || { echo "Android sdkmanager is unavailable."; exit 1; }
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode and validate release upload key
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/arena-v3-upload.jks"
          printf '%s' "$ARENA_ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$ARENA_ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ARENA_ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          echo "ARENA_ANDROID_RELEASE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Verify native API endpoint
        shell: bash
        run: |
          curl -fsSL --connect-timeout 10 --max-time 30 \
            "$V3_NATIVE_API_URL/health?commit=$MOBILE_V3_COMMIT_SHA" \
            > /tmp/mobile-v3-release-health.json
          curl -fsSL --connect-timeout 10 --max-time 45 \
            "$V3_NATIVE_API_URL/v1/lol/schedule?states=live,paused,scheduled,unknown" \
            > /tmp/mobile-v3-release-schedule.json
          node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync("/tmp/mobile-v3-release-health.json", "utf8"));
            const schedule = JSON.parse(fs.readFileSync("/tmp/mobile-v3-release-schedule.json", "utf8"));
            process.exit(health.ok === true && health.adapters?.includes("lol") && schedule.esport === "lol" && Array.isArray(schedule.events) ? 0 : 1);
          '

      - name: Validate native Android release source
        shell: bash
        run: |
          build_gradle="apps/arena-android/app/build.gradle.kts"
          test -f apps/arena-android/app/src/main/java/live/esports/arena/MainActivity.kt
          grep -Fq 'applicationId = "live.esports.arena"' "$build_gradle"
          grep -Fq 'signingConfig = releaseSigning' "$build_gradle"
          if grep -R -E 'android\.webkit\.WebView|CapacitorActivity|com\.getcapacitor' apps/arena-android/app/src/main; then
            echo "Release source is not native-only."
            exit 1
          fi

      - name: Build signed Play AAB
        shell: bash
        run: |
          chmod +x apps/arena-android/gradlew
          cd apps/arena-android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify and stage signed AAB
        shell: bash
        run: |
          aab="apps/arena-android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          jarsigner -verify "$aab"
          mkdir -p artifacts
          short_sha="${MOBILE_V3_COMMIT_SHA:0:7}"
          safe_version="${ARENA_ANDROID_VERSION_NAME//[^A-Za-z0-9._-]/-}"
          cp "$aab" "artifacts/arena-v3-${safe_version}-${short_sha}-release.aab"
          sha256sum artifacts/*.aab > artifacts/SHA256SUMS.txt

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v7
        with:
          name: arena-v3-android-release-${{ env.ARENA_ANDROID_VERSION_NAME }}-${{ github.sha }}
          path: |
            artifacts/*.aab
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android release status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$RELEASE_JOB_STATUS" == "success" ]]; then
            state="success"
            description="ARENA V3 signed Play AAB built"
          else
            state="failure"
            description="ARENA V3 signed Play AAB build failed"
          fi
          STATE="$state" DESCRIPTION="$description" node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/mobile-v3-android-release-status.json", JSON.stringify({
              state: process.env.STATE,
              context: "esports-live/mobile-v3-android-release",
              description: process.env.DESCRIPTION,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/mobile-v3-android-release-status.json
