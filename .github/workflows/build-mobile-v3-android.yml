name: Build Native ARENA Android

on:
  push:
    branches:
      - mobile-v3
    paths:
      - apps/arena-android/**
      - .github/workflows/build-mobile-v3-android.yml
      - .github/workflows/build-mobile-v3-android-release.yml
  workflow_dispatch:

concurrency:
  group: mobile-v3-android
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

env:
  MOBILE_V3_COMMIT_SHA: ${{ github.sha }}
  ARENA_ANDROID_API_URL: https://mobile-demo-esports-live-api.acchtt.workers.dev
  ARENA_ANDROID_VERSION_NAME: 0.3.4
  ARENA_ANDROID_VERSION_CODE: ${{ github.run_number }}
  ARENA_ANDROID_EXPECTED_SIGNER_SHA256: 0c1eef0be39008076ed3d5549412690eb58d143f91e6fe57f9d525a28faaa37c

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Mark native Android build pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/arena-android-status.json", JSON.stringify({
              state: "pending",
              context: "esports-live/mobile-v3-android",
              description: "Native ARENA Android APK/AAB build is running",
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/arena-android-status.json

      - name: Check out native application
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Android debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: arena-v3-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=ARENA,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS
          fi
          echo "ARENA_ANDROID_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "ARENA_ANDROID_DEBUG_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ARENA_ANDROID_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "ARENA_ANDROID_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Install Android SDK 36
        shell: bash
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then sdkmanager_path="$(command -v sdkmanager)"; fi
          test -n "$sdkmanager_path" || { echo "Android sdkmanager is unavailable."; exit 1; }
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify LoL API endpoint
        shell: bash
        run: |
          for attempt in {1..8}; do
            if curl -fsSL --connect-timeout 10 --max-time 30 \
              "$ARENA_ANDROID_API_URL/health?commit=$MOBILE_V3_COMMIT_SHA" \
              > /tmp/arena-health.json \
              && curl -fsSL --connect-timeout 10 --max-time 45 \
                "$ARENA_ANDROID_API_URL/v1/lol/schedule?states=live,paused,scheduled,unknown&limit=1" \
                > /tmp/arena-schedule.json \
              && node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync("/tmp/arena-health.json", "utf8"));
                const schedule = JSON.parse(fs.readFileSync("/tmp/arena-schedule.json", "utf8"));
                const good = health.ok === true && health.adapters?.includes("lol") && schedule.esport === "lol" && Array.isArray(schedule.events);
                process.exit(good ? 0 : 1);
              '; then
              exit 0
            fi
            sleep 5
          done
          echo "LoL API verification failed."
          exit 1

      - name: Validate native-only Android source
        shell: bash
        run: |
          test -f apps/arena-android/app/src/main/java/live/esports/arena/MainActivity.kt
          test -f apps/arena-android/app/src/main/java/live/esports/arena/ArenaApp.kt
          test -f apps/arena-android/app/src/main/java/live/esports/arena/ArenaApi.kt
          test -f apps/arena-android/app/src/main/java/live/esports/arena/ArenaUpdater.kt
          test -f apps/arena-android/app/src/main/java/live/esports/arena/ArenaUpdateUi.kt
          test -f apps/arena-android/app/src/debug/AndroidManifest.xml
          grep -Fq 'applicationId = "live.esports.arena"' apps/arena-android/app/build.gradle.kts
          grep -Fq 'compileSdk = 36' apps/arena-android/app/build.gradle.kts
          grep -Fq 'IN_APP_UPDATE_ENABLED", "true"' apps/arena-android/app/build.gradle.kts
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' apps/arena-android/app/src/debug/AndroidManifest.xml
          grep -Fq 'Dota is intentionally not present' apps/arena-android/README.md
          if grep -R -E 'android\.webkit\.WebView|CapacitorActivity|com\.getcapacitor' apps/arena-android/app/src/main; then
            echo "A WebView or Capacitor dependency leaked into the native app."
            exit 1
          fi

      - name: Test and build native Android debug APK and AAB
        shell: bash
        run: |
          chmod +x apps/arena-android/gradlew apps/arena-android/scripts/run-android-smoke.sh
          cd apps/arena-android
          ./gradlew testDebugUnitTest assembleDebug bundleDebug --no-daemon --stacktrace

      - name: Enable Android emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 16 and verify native UI
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash apps/arena-android/scripts/run-android-smoke.sh

      - name: Upload native Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arena-native-android-smoke-${{ github.sha }}
          path: artifacts/android-smoke-*
          if-no-files-found: warn
          retention-days: 14

      - name: Verify native Android packages
        shell: bash
        run: |
          apk="apps/arena-android/app/build/outputs/apk/debug/app-debug.apk"
          aab="apps/arena-android/app/build/outputs/bundle/debug/app-debug.aab"
          test -s "$apk"
          test -s "$aab"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" > /tmp/arena-apk-badging.txt
          grep -Fq "package: name='live.esports.arena'" /tmp/arena-apk-badging.txt
          grep -Fq "application-label:'ARENA'" /tmp/arena-apk-badging.txt
          grep -Fq "android.permission.REQUEST_INSTALL_PACKAGES" /tmp/arena-apk-badging.txt
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/arena-apk-signing.txt
          signer_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/arena-apk-signing.txt)"
          test -n "$signer_sha256"
          if [[ "$signer_sha256" != "$ARENA_ANDROID_EXPECTED_SIGNER_SHA256" ]]; then
            echo "Unexpected ARENA Android signer: $signer_sha256"
            exit 1
          fi
          echo "ARENA_ANDROID_SIGNER_SHA256=$signer_sha256" >> "$GITHUB_ENV"
          jarsigner -verify "$aab"

      - name: Stage public native APK
        shell: bash
        run: |
          mkdir -p artifacts
          apk="apps/arena-android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$apk" "artifacts/ARENA-v${ARENA_ANDROID_VERSION_NAME}.apk"
          cp "$apk" artifacts/arena-v3-latest.apk
          apk_sha="$(sha256sum artifacts/arena-v3-latest.apk | awk '{print $1}')"
          apk_size="$(stat -c '%s' artifacts/arena-v3-latest.apk)"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s  %s\n' "$apk_sha" "arena-v3-latest.apk" > artifacts/arena-v3-SHA256SUMS.txt
          APK_SHA="$apk_sha" APK_SIZE="$apk_size" PUBLISHED_AT="$published_at" node - <<'NODE'
          const fs = require('node:fs');
          const manifest = {
            schemaVersion: 1,
            packageId: 'live.esports.arena',
            versionCode: Number(process.env.ARENA_ANDROID_VERSION_CODE),
            versionName: process.env.ARENA_ANDROID_VERSION_NAME,
            apkUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/arena-v3-android-latest/arena-v3-latest.apk?versionCode=${process.env.ARENA_ANDROID_VERSION_CODE}`,
            sha256: process.env.APK_SHA,
            signerSha256: process.env.ARENA_ANDROID_SIGNER_SHA256,
            sizeBytes: Number(process.env.APK_SIZE),
            releaseNotes: 'ARENA 0.3.4 adds verified in-app updates for sideload builds while keeping the compact Match Center refinements.',
            publishedAt: process.env.PUBLISHED_AT,
            commit: process.env.MOBILE_V3_COMMIT_SHA
          };
          fs.writeFileSync('artifacts/arena-v3-latest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish direct native APK channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="arena-v3-android-latest"
          title="ARENA Android ${ARENA_ANDROID_VERSION_NAME} · Native rebuild"
          notes="Native phone-first ARENA client for League of Legends. Version 0.3.4 adds verified in-app updates for the sideload channel. Every downloaded APK is checked against its published SHA-256, package ID, version code, and the signing certificate already installed on the phone."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "artifacts/ARENA-v${ARENA_ANDROID_VERSION_NAME}.apk" \
            artifacts/arena-v3-latest.apk \
            artifacts/arena-v3-SHA256SUMS.txt \
            artifacts/arena-v3-latest.json

      - name: Verify public in-app update channel
        shell: bash
        run: |
          manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/download/arena-v3-android-latest/arena-v3-latest.json"
          apk_url="https://github.com/$GITHUB_REPOSITORY/releases/download/arena-v3-android-latest/arena-v3-latest.apk"
          local_apk="artifacts/arena-v3-latest.apk"
          local_sha="$(sha256sum "$local_apk" | awk '{print $1}')"
          local_size="$(stat -c '%s' "$local_apk")"
          verified=false
          for attempt in {1..8}; do
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 45 \
              "${manifest_url}?commit=${MOBILE_V3_COMMIT_SHA}&attempt=${attempt}" \
              > /tmp/arena-public-update.json \
              && EXPECTED_SHA="$local_sha" EXPECTED_SIZE="$local_size" node -e '
                const fs = require("node:fs");
                const manifest = JSON.parse(fs.readFileSync("/tmp/arena-public-update.json", "utf8"));
                const expectedUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/arena-v3-android-latest/arena-v3-latest.apk?versionCode=${process.env.ARENA_ANDROID_VERSION_CODE}`;
                const good = manifest.schemaVersion === 1
                  && manifest.packageId === "live.esports.arena"
                  && manifest.versionCode === Number(process.env.ARENA_ANDROID_VERSION_CODE)
                  && manifest.versionName === process.env.ARENA_ANDROID_VERSION_NAME
                  && manifest.apkUrl === expectedUrl
                  && manifest.sha256 === process.env.EXPECTED_SHA
                  && manifest.signerSha256 === process.env.ARENA_ANDROID_SIGNER_SHA256
                  && manifest.sizeBytes === Number(process.env.EXPECTED_SIZE)
                  && manifest.commit === process.env.MOBILE_V3_COMMIT_SHA;
                process.exit(good ? 0 : 1);
              '; then
              verified=true
              break
            fi
            sleep 3
          done
          [[ "$verified" == "true" ]] || { echo "Public update manifest did not converge to this build."; exit 1; }
          curl -fsSL --retry 4 --connect-timeout 10 --max-time 180 \
            "${apk_url}?versionCode=${ARENA_ANDROID_VERSION_CODE}&commit=${MOBILE_V3_COMMIT_SHA}" \
            -o /tmp/arena-public-update.apk
          public_sha="$(sha256sum /tmp/arena-public-update.apk | awk '{print $1}')"
          [[ "$public_sha" == "$local_sha" ]] || { echo "Public update APK hash mismatch."; exit 1; }

      - name: Upload native APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: arena-native-android-${{ github.sha }}
          path: |
            artifacts/*.apk
            apps/arena-android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish native Android build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$ANDROID_JOB_STATUS" == "success" ]]; then
            state="success"
            description="Native ARENA Android built, rendered, and update channel verified"
          else
            state="failure"
            description="Native ARENA Android build failed"
          fi
          STATE="$state" DESCRIPTION="$description" node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/arena-android-status.json", JSON.stringify({
              state: process.env.STATE,
              context: "esports-live/mobile-v3-android",
              description: process.env.DESCRIPTION,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/arena-android-status.json
