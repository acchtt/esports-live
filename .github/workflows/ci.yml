name: CI

on:
  push:
    branches: [main, demo, mobile-demo]
  pull_request:
    branches: [main, demo]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck and test
        run: npm run check

      - name: Production browser stability suite
        if: github.base_ref == 'main' || github.ref_name == 'main'
        run: npm run test:web

      - name: Mobile demo browser suite
        if: github.base_ref == 'demo' || github.ref_name == 'mobile-demo' || github.ref_name == 'demo'
        run: |
          npm run build:web
          npx playwright test tests/web/mobile-demo.spec.ts tests/web/mobile-demo-history.spec.ts tests/web/completed-board-merge.spec.ts tests/web/history-mode-ownership.spec.ts tests/web/live-poll-recovery.spec.ts
