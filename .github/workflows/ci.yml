name: CI

on:
  push:
    branches: [main, demo, mobile-demo]
  pull_request:
    branches: [main, demo]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck and test
        run: npm run check

      - name: Desktop browser stability suite
        if: github.ref_name == 'main' || github.ref_name == 'demo' || github.base_ref == 'main' || github.base_ref == 'demo'
        run: npm run test:web

      - name: Mobile application browser suite
        if: github.ref_name == 'mobile-demo' || github.head_ref == 'mobile-demo'
        run: npm run test:web-mobile
