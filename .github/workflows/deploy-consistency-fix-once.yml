name: Verify Consistency Fix Release

on:
  pull_request:
    paths:
      - .github/workflows/deploy-consistency-fix-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify production behavior
        shell: bash
        run: |
          node - <<'NODE'
          const api = 'https://esports-live-api.acchtt.workers.dev';
          const web = 'https://esports-live.pages.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function json(url) {
            const response = await fetch(url, { headers: { accept: 'application/json', 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response.json();
          }
          async function text(url) {
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response.text();
          }

          const health = await json(`${api}/health?probe=${Date.now()}`);
          if (!health?.ok) throw new Error('Production API is not healthy.');

          const html = await text(`${web}/?verify=${Date.now()}`);
          const assetSources = [...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(match => match[1]);
          if (!assetSources.some(src => src.includes('index-BjYCvBgd.js'))) {
            throw new Error(`Expected production bundle is not active: ${JSON.stringify(assetSources)}`);
          }

          const schedule = await json(`${api}/v1/lol/schedule?states=live,paused,completed,scheduled&limit=80&probe=${Date.now()}`);
          const events = Array.isArray(schedule.events) ? schedule.events : [];
          const archivedIds = [
            '115548147900684638',
            '115548147900684639',
            '115548147900684640',
            '115570814727903842',
            '115570814727903843'
          ];
          const listedIds = events.flatMap(event => (
            Array.isArray(event?.series?.games) ? event.series.games.map(game => game?.id) : []
          )).filter(Boolean);
          const gameIds = [...new Set([...archivedIds, ...listedIds])];

          let snapshotReport = null;
          const snapshotErrors = [];
          for (const gameId of gameIds.slice(0, 35)) {
            try {
              const first = await json(`${api}/v1/lol/games/${encodeURIComponent(gameId)}/live?verify=${Date.now()}`);
              await sleep(2200);
              const second = await json(`${api}/v1/lol/games/${encodeURIComponent(gameId)}/live?verify=${Date.now()}`);
              if (!first.stats && !second.stats) continue;

              const firstSource = Date.parse(first.quality?.sourceTimestamp ?? '');
              const secondSource = Date.parse(second.quality?.sourceTimestamp ?? '');
              const firstClock = first.stats?.gameClockSeconds ?? null;
              const secondClock = second.stats?.gameClockSeconds ?? null;
              if (Number.isFinite(firstSource) && Number.isFinite(secondSource) && secondSource < firstSource) {
                throw new Error('source timestamp regressed');
              }
              if (firstClock !== null && secondClock !== null && secondClock + 2 < firstClock) {
                throw new Error('game clock regressed');
              }

              const players = [...(second.stats?.blue?.players ?? []), ...(second.stats?.red?.players ?? [])];
              snapshotReport = {
                gameId,
                firstSource: first.quality?.sourceTimestamp ?? null,
                secondSource: second.quality?.sourceTimestamp ?? null,
                firstClock,
                secondClock,
                players: players.length,
                playersWithItemArrays: players.filter(player => Array.isArray(player.items)).length,
                playersWithNonemptyItems: players.filter(player => Array.isArray(player.items) && player.items.length > 0).length
              };
              break;
            } catch (error) {
              snapshotErrors.push({ gameId, message: String(error?.message ?? error) });
              if (String(error?.message ?? '').includes('regressed')) throw error;
            }
          }
          if (!snapshotReport) {
            throw new Error(`No stats-bearing snapshot was available: ${JSON.stringify(snapshotErrors.slice(0, 8))}`);
          }
          if (snapshotReport.players === 10 && snapshotReport.playersWithItemArrays < 10) {
            throw new Error(`Not all players have item arrays: ${JSON.stringify(snapshotReport)}`);
          }

          const seriesIds = events.slice(0, 36).map(event => event?.series?.id).filter(Boolean);
          const contexts = [];
          let cursor = 0;
          await Promise.all(Array.from({ length: 4 }, async () => {
            while (cursor < seriesIds.length) {
              const seriesId = seriesIds[cursor++];
              try {
                contexts.push(await json(`${api}/v1/lol/series/${encodeURIComponent(seriesId)}/context?verify=${Date.now()}`));
              } catch {}
            }
          }));

          let winnerReport = null;
          for (const context of contexts) {
            const history = context?.history;
            if (!history?.games?.length) continue;
            const completed = history.games.filter(game => game.state === 'completed');
            if (!completed.length) continue;
            const score = history.score.map(entry => entry.wins);
            const winnerIndex = score[0] >= history.winsRequired ? 0 : score[1] >= history.winsRequired ? 1 : null;
            const clincher = [...completed].sort((a, b) => b.number - a.number)[0];
            if ((score[0] === 0 || score[1] === 0) && completed.every(game => game.winner?.id)) {
              winnerReport = { seriesId: context.seriesId, mode: 'sweep', score, resolvedGames: completed.length };
              break;
            }
            if (winnerIndex !== null && clincher?.winner?.id === history.score[winnerIndex]?.team?.id) {
              winnerReport = { seriesId: context.seriesId, mode: 'clincher', score, game: clincher.number };
              break;
            }
          }
          if (!winnerReport) throw new Error('No deterministic winner case was available in the current context sample.');

          console.log(`PRODUCTION_REPORT=${JSON.stringify({
            health,
            listings: events.length,
            assetSources,
            snapshotReport,
            winnerReport
          })}`);
          NODE
