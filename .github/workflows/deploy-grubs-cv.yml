name: Deploy Grubs CV

on:
  push:
    branches: [mobile-demo]
    paths:
      - 'services/grubs-cv/**'
      - '.github/workflows/deploy-grubs-cv.yml'
  workflow_dispatch:

concurrency:
  group: grubs-cv-mobile-demo
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install repository dependencies
        run: npm install

      - name: Install Cloudflare Containers helper
        run: npm install --no-save @cloudflare/containers@0.3.7

      - name: Test Grubs CV service primitives
        run: node --test services/grubs-cv/*.test.mjs

      - name: Deploy Worker and FFmpeg container
        id: deploy
        shell: bash
        run: |
          output="$(npx wrangler deploy --config services/grubs-cv/wrangler.jsonc 2>&1)"
          echo "$output"
          url="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' <<<"$output" | tail -n 1)"
          test -n "$url" || { echo "Wrangler did not return a workers.dev URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Grubs CV" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify container health
        env:
          GRUBS_CV_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS --connect-timeout 10 --max-time 30 "$GRUBS_CV_URL/health" > /tmp/grubs-cv-health.json \
              && node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync("/tmp/grubs-cv-health.json", "utf8"));
                process.exit(value.ok === true && value.service === "grubs-cv" ? 0 : 1);
              '; then
              cat /tmp/grubs-cv-health.json
              echo "Grubs CV container is healthy at $GRUBS_CV_URL"
              exit 0
            fi
            echo "Grubs CV container not ready (attempt $attempt/60)."
            cat /tmp/grubs-cv-health.json 2>/dev/null || true
            sleep 10
          done
          echo "Grubs CV container health verification failed."
          exit 1
