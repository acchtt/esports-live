name: Verify Live Data Parity Release

on:
  pull_request:
    paths:
      - .github/workflows/deploy-live-data-parity-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify propagated API and Pages release
        shell: bash
        run: |
          node - <<'NODE'
          const api = 'https://esports-live-api.acchtt.workers.dev';
          const web = 'https://esports-live.pages.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function json(url) {
            const response = await fetch(url, { headers: { accept: 'application/json', 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response.json();
          }

          async function text(url) {
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response.text();
          }

          let health = null;
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            try {
              health = await json(`${api}/health?probe=${Date.now()}`);
              if (health?.ok) break;
            } catch {}
            await sleep(5000);
          }
          if (!health?.ok) throw new Error('Production API did not become healthy.');

          const schedule = await json(`${api}/v1/lol/schedule?states=live,paused,completed,scheduled&limit=80&probe=${Date.now()}`);
          const events = Array.isArray(schedule.events) ? schedule.events : [];
          const target = events.find(event => ['live', 'paused'].includes(event?.series?.state))
            ?? events.find(event => event?.series?.games?.some(game => game.state === 'completed'));
          let snapshotReport = { available: false };
          if (target) {
            const games = Array.isArray(target.series?.games) ? target.series.games : [];
            const game = games.find(game => ['live', 'draft'].includes(game.state))
              ?? [...games].reverse().find(game => game.state === 'completed');
            if (game?.id) {
              const snapshot = await json(`${api}/v1/lol/games/${encodeURIComponent(game.id)}/live?verify=${Date.now()}`);
              snapshotReport = {
                available: true,
                seriesId: target.series.id,
                gameId: game.id,
                listedState: game.state,
                snapshotState: snapshot.game?.state ?? null,
                clock: snapshot.stats?.gameClockSeconds ?? null,
                blueGold: snapshot.stats?.blue?.gold ?? null,
                redGold: snapshot.stats?.red?.gold ?? null,
                bluePlayers: snapshot.stats?.blue?.players?.length ?? 0,
                redPlayers: snapshot.stats?.red?.players?.length ?? 0,
                sourceTimestamp: snapshot.quality?.sourceTimestamp ?? null
              };
              if (snapshot.stats && snapshot.stats.gameClockSeconds == null) {
                throw new Error(`Stats-bearing snapshot returned without a clock: ${JSON.stringify(snapshotReport)}`);
              }
            }
          }

          let markers = null;
          let assetSources = [];
          for (let attempt = 1; attempt <= 24; attempt += 1) {
            try {
              const html = await text(`${web}/?verify=${Date.now()}`);
              const scripts = [...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(match => match[1]);
              assetSources = scripts;
              const bundles = await Promise.all(scripts.map(src => text(`${new URL(src, web)}?verify=${Date.now()}`)));
              const bundle = bundles.join('\n');
              markers = {
                liveClock: bundle.includes('live-game-clock'),
                historyEvent: bundle.includes('esports-live:snapshot'),
                durationEnrichment: bundle.includes('Duration loading'),
                goldDifference: bundle.includes('Gold diff'),
                playerItems: bundle.includes('Items unavailable')
              };
              if (Object.values(markers).every(Boolean)) break;
            } catch {}
            await sleep(5000);
          }
          if (!markers || Object.values(markers).some(value => !value)) {
            throw new Error(`Pages release did not propagate: ${JSON.stringify({ assetSources, markers })}`);
          }
          console.log(`PRODUCTION_REPORT=${JSON.stringify({ health, listings: events.length, snapshotReport, assetSources, markers })}`);
          NODE
