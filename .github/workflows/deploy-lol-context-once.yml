name: Deploy LoL Context Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-lol-context-once.yml

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$API_BASE_URL" || { echo "Missing VITE_API_BASE_URL"; exit 1; }
      - run: npm install
      - run: npm run check
      - name: Deploy API Worker
        run: npm run deploy:api
      - name: Verify production API
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$API_BASE_URL/health" > /tmp/health.json; then
              break
            fi
            sleep 5
          done
          node -e '
            const health = require("/tmp/health.json");
            if (!health.ok || !health.adapters?.includes("lol")) process.exit(1);
          '
          curl --fail --silent --show-error "$API_BASE_URL/v1/lol/schedule?limit=2" > /tmp/schedule.json
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/schedule.json", "utf8"));
            if (!Array.isArray(payload.events) || !payload.page || payload.page.limit !== 2) process.exit(1);
            const seriesId = payload.events[0]?.series?.id;
            if (!seriesId) process.exit(1);
            fs.writeFileSync("/tmp/series-id.txt", seriesId);
          '
          series_id="$(cat /tmp/series-id.txt)"
          curl --fail --silent --show-error "$API_BASE_URL/v1/lol/series/$series_id/context" > /tmp/context.json
          node -e '
            const context = require("/tmp/context.json");
            if (context.schemaVersion !== "1.0" || context.esport !== "lol" || !Array.isArray(context.rosters) || !Array.isArray(context.standings)) process.exit(1);
          '
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Deploy Pages application
        run: >-
          npx wrangler pages deploy apps/web/dist
          --project-name esports-live
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "Deploy LoL context milestone"
      - name: Record successful deployment
        shell: bash
        run: |
          mkdir -p .deployment
          cat > .deployment/lol-context-latest.txt <<EOF
          status=success
          source_commit=$GITHUB_SHA
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          api=$API_BASE_URL
          web=https://esports-live.pages.dev
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .deployment/lol-context-latest.txt
          git commit -m "Record LoL context deployment"
          git push
