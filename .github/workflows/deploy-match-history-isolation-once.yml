name: Verify Match History Isolation Release

on:
  pull_request:
    paths:
      - .github/workflows/deploy-match-history-isolation-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify production bundle
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const web = 'https://esports-live.pages.dev';
          const expectedAsset = '/assets/index-LY5qif3f.js';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchText(url) {
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return {
              contentType: response.headers.get('content-type') ?? '',
              text: await response.text()
            };
          }

          let html = '';
          let bundle = '';
          let contentType = '';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const page = await fetchText(`${web}/?release=${Date.now()}`).catch(() => ({ contentType: '', text: '' }));
            html = page.text;
            if (!html.includes(expectedAsset)) {
              await sleep(4000);
              continue;
            }

            const asset = await fetchText(`${new URL(expectedAsset, web)}?release=${Date.now()}`).catch(() => ({ contentType: '', text: '' }));
            contentType = asset.contentType;
            bundle = asset.text;
            if (/javascript|ecmascript/i.test(contentType) && bundle.includes('match-history')) break;
            await sleep(4000);
          }

          if (!html.includes(expectedAsset)) throw new Error(`Expected asset is not active: ${expectedAsset}`);
          if (!/javascript|ecmascript/i.test(contentType)) {
            throw new Error(`Asset URL did not return JavaScript: ${JSON.stringify({ contentType, prefix: bundle.slice(0, 80) })}`);
          }

          const markers = {
            matchHistoryMode: bundle.includes('match-history'),
            bodyViewMode: bundle.includes('viewMode'),
            completedDetail: bundle.includes('completed-match-detail'),
            activeSurfaceGuard: bundle.includes('series-history') && bundle.includes('game-content')
          };
          if (Object.values(markers).some(value => !value)) throw new Error(`Missing markers: ${JSON.stringify(markers)}`);
          console.log(`PRODUCTION_REPORT=${JSON.stringify({ expectedAsset, contentType, markers })}`);
          NODE
