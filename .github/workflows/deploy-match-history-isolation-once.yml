name: Deploy Match History Isolation Once

on:
  pull_request:
    paths:
      - .github/workflows/deploy-match-history-isolation-once.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a42e5b4a6ea2400a280888973fce62de52d97b63
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Deploy Pages
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npx wrangler pages deploy apps/web/dist --project-name esports-live --branch main --commit-hash a42e5b4a6ea2400a280888973fce62de52d97b63 --commit-message "Isolate match history from active panels"; then exit 0; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Verify production bundle
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const web = 'https://esports-live.pages.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const localHtml = fs.readFileSync('apps/web/dist/index.html', 'utf8');
          const expectedAsset = localHtml.match(/<script[^>]+src="([^"]+\.js)"/)?.[1];
          if (!expectedAsset) throw new Error('No built JS asset found.');
          async function text(url) {
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response.text();
          }
          let html = '';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            html = await text(`${web}/?release=${Date.now()}`).catch(() => '');
            if (html.includes(expectedAsset)) break;
            await sleep(4000);
          }
          if (!html.includes(expectedAsset)) throw new Error(`Asset did not propagate: ${expectedAsset}`);
          const bundle = await text(`${new URL(expectedAsset, web)}?release=${Date.now()}`);
          const markers = {
            matchHistoryMode: bundle.includes('match-history'),
            bodyViewMode: bundle.includes('data-view-mode') || bundle.includes('viewMode'),
            completedDetail: bundle.includes('completed-match-detail'),
            activeSurfaceGuard: bundle.includes('series-history') && bundle.includes('game-content')
          };
          if (Object.values(markers).some(value => !value)) throw new Error(`Missing markers: ${JSON.stringify(markers)}`);
          console.log(`PRODUCTION_REPORT=${JSON.stringify({ expectedAsset, markers })}`);
          NODE
