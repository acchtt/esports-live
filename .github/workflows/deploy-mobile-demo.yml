name: Deploy Mobile Preview

on:
  push:
    branches:
      - mobile-demo
  workflow_dispatch:

concurrency:
  group: mobile-demo-deploy
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  MOBILE_DEMO_COMMIT_SHA: ${{ github.sha }}

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Mark mobile preview pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/mobile-preview-status.json", JSON.stringify({
              state: "pending",
              context: "esports-live/mobile-preview",
              description: "Mobile preview validation is running",
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/mobile-preview-status.json

      - name: Check deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Check out mobile demo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate application
        run: npm run check

      - name: Validate mobile browser layout
        shell: bash
        run: |
          npm run build:web
          npx playwright test \
            tests/web/mobile-demo.spec.ts \
            tests/web/mobile-demo-history.spec.ts \
            tests/web/mobile-scoreboard-recovery.spec.ts \
            tests/web/mobile-live-board-layout.spec.ts \
            tests/web/mobile-live-history-copy.spec.ts \
            tests/web/completed-board-merge.spec.ts \
            tests/web/history-mode-ownership.spec.ts \
            tests/web/live-poll-recovery.spec.ts \
            tests/web/live-telemetry-pending.spec.ts

      - name: Enable Worker preview URLs
        run: npx wrangler triggers deploy

      - name: Upload mobile demo API Worker version
        id: api-preview
        shell: bash
        run: |
          output="$(npx wrangler versions upload \
            --preview-alias mobile-demo \
            --keep-vars \
            --message "Mobile demo $MOBILE_DEMO_COMMIT_SHA" 2>&1)"
          echo "$output"
          url="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' <<<"$output" | tail -n 1)"
          test -n "$url" || { echo "Wrangler did not return a Worker preview URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify mobile demo API
        env:
          API_BASE_URL: ${{ steps.api-preview.outputs.url }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --connect-timeout 10 --max-time 30 "$API_BASE_URL/health?commit=$MOBILE_DEMO_COMMIT_SHA" > /tmp/mobile-demo-health.json \
              && node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync("/tmp/mobile-demo-health.json", "utf8"));
                process.exit(value.ok === true && value.service === "esports-live-api" && value.adapters?.includes("lol") ? 0 : 1);
              '; then
              echo "Mobile demo API is available at $API_BASE_URL"
              exit 0
            fi
            echo "Mobile demo API not ready (attempt $attempt/12)."
            cat /tmp/mobile-demo-health.json 2>/dev/null || true
            sleep 5
          done
          echo "Mobile demo API verification failed."
          exit 1

      - name: Prepare mobile build metadata
        shell: bash
        run: |
          echo "VITE_BUILD_SHA=$MOBILE_DEMO_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA_SHORT=${MOBILE_DEMO_COMMIT_SHA:0:7}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_RUN=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build mobile demo application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ steps.api-preview.outputs.url }}

      - name: Confirm preview API and build metadata are embedded
        env:
          API_BASE_URL: ${{ steps.api-preview.outputs.url }}
        shell: bash
        run: |
          grep -R "$API_BASE_URL" apps/web/dist/assets
          grep -q "$VITE_BUILD_SHA_SHORT" apps/web/dist/index.html
          grep -R "DEMO v0.17.1" apps/web/dist/assets

      - name: Deploy mobile Pages preview
        run: >-
          npx wrangler pages deploy apps/web/dist
          --project-name esports-live
          --branch mobile-demo
          --commit-hash "$MOBILE_DEMO_COMMIT_SHA"
          --commit-message "Mobile demo $MOBILE_DEMO_COMMIT_SHA"

      - name: Verify mobile shell and version
        shell: bash
        run: |
          url="https://mobile-demo.esports-live.pages.dev/?commit=$MOBILE_DEMO_COMMIT_SHA"
          for attempt in {1..12}; do
            html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$url" || true)"
            asset="$(grep -Eo 'src="[^"]+assets/[^"]+\.js"' <<<"$html" | head -n 1 | cut -d'"' -f2)"
            if [[ "$asset" == /* ]]; then asset="https://mobile-demo.esports-live.pages.dev$asset"; fi
            script="$(curl -fsSL --connect-timeout 10 --max-time 30 "$asset" || true)"
            if grep -q '<title>Esports Live</title>' <<<"$html" \
              && grep -q 'class="app-frame"' <<<"$html" \
              && grep -q "$VITE_BUILD_SHA_SHORT" <<<"$html" \
              && grep -q 'DEMO v0.17.1' <<<"$script"; then
              echo "Mobile demo build $VITE_BUILD_SHA_SHORT is available at $url"
              exit 0
            fi
            echo "Mobile demo build $VITE_BUILD_SHA_SHORT not ready (attempt $attempt/12)."
            sleep 5
          done
          echo "Mobile demo verification failed for build $VITE_BUILD_SHA_SHORT."
          exit 1

      - name: Publish mobile preview status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$DEPLOY_JOB_STATUS" == "success" ]]; then
            state="success"
            description="Mobile preview deployed and verified"
          else
            state="failure"
            description="Mobile preview deployment failed"
          fi
          STATE="$state" DESCRIPTION="$description" node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/mobile-preview-status.json", JSON.stringify({
              state: process.env.STATE,
              context: "esports-live/mobile-preview",
              description: process.env.DESCRIPTION,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/mobile-preview-status.json
