name: Deploy Mobile Preview

on:
  pull_request:
    branches:
      - demo
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: mobile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  MOBILE_DEMO_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
  MOBILE_API_BASE_URL: https://esports-live-api.acchtt.workers.dev

jobs:
  deploy:
    if: github.head_ref == 'mobile-demo'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Check out mobile demo commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck and unit tests
        run: npm run check

      - name: Validate mobile browser layout
        shell: bash
        run: |
          npm run build:web
          npx playwright test \
            tests/web/mobile-demo.spec.ts \
            tests/web/mobile-demo-history.spec.ts \
            tests/web/completed-board-merge.spec.ts \
            tests/web/history-mode-ownership.spec.ts

      - name: Prepare mobile build metadata
        shell: bash
        run: |
          echo "VITE_BUILD_SHA=$MOBILE_DEMO_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA_SHORT=${MOBILE_DEMO_COMMIT_SHA:0:7}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_RUN=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build mobile demo application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ env.MOBILE_API_BASE_URL }}

      - name: Confirm mobile marker and API are embedded
        shell: bash
        run: |
          grep -R "$MOBILE_API_BASE_URL" apps/web/dist/assets
          grep -q "$VITE_BUILD_SHA_SHORT" apps/web/dist/index.html
          grep -R "DEMO v0.3" apps/web/dist/assets

      - name: Deploy mobile Pages preview
        run: >-
          npx wrangler pages deploy apps/web/dist
          --project-name esports-live
          --branch mobile-demo
          --commit-hash "$MOBILE_DEMO_COMMIT_SHA"
          --commit-message "Mobile demo $MOBILE_DEMO_COMMIT_SHA"

      - name: Verify deployed mobile build
        shell: bash
        run: |
          url="https://mobile-demo.esports-live.pages.dev/?commit=$MOBILE_DEMO_COMMIT_SHA"
          for attempt in {1..12}; do
            html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$url" || true)"
            asset="$(grep -Eo 'src="[^"]+assets/[^"]+\.js"' <<<"$html" | head -n 1 | cut -d'"' -f2)"
            if [[ "$asset" == /* ]]; then asset="https://mobile-demo.esports-live.pages.dev$asset"; fi
            script="$(curl -fsSL --connect-timeout 10 --max-time 30 "$asset" || true)"
            if grep -q "$VITE_BUILD_SHA_SHORT" <<<"$html" && grep -q "DEMO v0.3" <<<"$script"; then
              echo "Mobile demo v0.3 build $VITE_BUILD_SHA_SHORT is live at $url"
              exit 0
            fi
            echo "Mobile demo v0.3 not ready (attempt $attempt/12)."
            sleep 5
          done
          echo "Mobile demo deployment verification failed."
          exit 1
