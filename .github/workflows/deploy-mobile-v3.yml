name: Deploy Mobile V3 Preview

on:
  push:
    branches:
      - mobile-v3
    paths:
      - apps/web-v3/**
      - apps/api/**
      - packages/**
      - tests/web/web-v2-*.spec.ts
      - tests/web/web-v3-*.spec.ts
      - package.json
      - package-lock.json
      - playwright.config.ts
      - tsconfig.json
      - wrangler.toml
      - .github/workflows/build-mobile-v3-android-release.yml
      - .github/workflows/deploy-mobile-v3.yml
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: mobile-v3-deploy
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  MOBILE_V3_COMMIT_SHA: ${{ github.sha }}
  MOBILE_V3_VERSION: 0.1.0
  V3_D1_DATABASE_NAME: esports-live-mobile-v3

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Mark V3 preview pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/mobile-v3-status.json", JSON.stringify({
              state: "pending",
              context: "esports-live/mobile-v3-preview",
              description: "ARENA V3 routed validation is running",
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/mobile-v3-status.json \
            || echo "GitHub status API unavailable; continuing with V3 validation."

      - name: Check deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$V3_D1_DATABASE_NAME" || { echo "Missing V3_D1_DATABASE_NAME"; exit 1; }

      - name: Check out V3 application
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        # GitHub's hosted Ubuntu image already carries Chromium's system libraries.
        # Avoid Playwright --with-deps here so a transient Ubuntu apt mirror outage
        # cannot block otherwise healthy V3 browser validation and deployment.
        run: npx playwright install chromium

      - name: Validate shared application code
        run: npm run check

      - name: Validate ARENA V3
        run: npm run test:web-v3

      - name: Prepare V3 D1 match database
        shell: bash
        run: |
          npx wrangler d1 list --json > /tmp/mobile-v3-d1-list.json
          database_id="$(DATABASE_NAME="$V3_D1_DATABASE_NAME" node -e '
            const fs = require("node:fs");
            const name = process.env.DATABASE_NAME;
            const list = JSON.parse(fs.readFileSync("/tmp/mobile-v3-d1-list.json", "utf8"));
            const match = Array.isArray(list) ? list.find(entry => entry?.name === name) : null;
            if (match?.uuid) process.stdout.write(String(match.uuid));
          ')"

          if [[ -z "$database_id" ]]; then
            echo "Creating D1 database $V3_D1_DATABASE_NAME."
            create_output="$(npx wrangler d1 create "$V3_D1_DATABASE_NAME" 2>&1)"
            echo "$create_output"
            database_id="$(grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' <<<"$create_output" | tail -n 1)"
          fi

          test -n "$database_id" || { echo "Could not resolve the V3 D1 database ID."; exit 1; }
          config="$GITHUB_WORKSPACE/.wrangler-mobile-v3.toml"
          cp wrangler.toml "$config"
          cat >> "$config" <<EOF

          [[d1_databases]]
          binding = "MATCH_DB"
          database_name = "$V3_D1_DATABASE_NAME"
          database_id = "$database_id"
          migrations_dir = "apps/api/migrations"
          EOF
          echo "V3_WRANGLER_CONFIG=$config" >> "$GITHUB_ENV"
          echo "V3_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Apply V3 D1 match migrations
        shell: bash
        run: |
          npx wrangler d1 migrations apply "$V3_D1_DATABASE_NAME" \
            --remote \
            --config "$V3_WRANGLER_CONFIG"
          result="$(npx wrangler d1 execute "$V3_D1_DATABASE_NAME" \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('match_series','match_games','match_contexts') ORDER BY name" \
            --json \
            --config "$V3_WRANGLER_CONFIG")"
          RESULT="$result" node -e '
            const value = JSON.parse(process.env.RESULT || "[]");
            const rows = value.flatMap(entry => entry?.results ?? []);
            const names = new Set(rows.map(row => row?.name));
            const required = ["match_series", "match_games", "match_contexts"];
            process.exit(required.every(name => names.has(name)) ? 0 : 1);
          '

      - name: Enable Worker preview URLs
        run: npx wrangler triggers deploy --config "$V3_WRANGLER_CONFIG"

      - name: Upload shared API Worker V3 primary preview
        id: api-preview
        shell: bash
        run: |
          output="$(npx wrangler versions upload \
            --config "$V3_WRANGLER_CONFIG" \
            --preview-alias mobile-v3-routed \
            --keep-vars \
            --message "ARENA V3 primary $MOBILE_V3_COMMIT_SHA" 2>&1)"
          echo "$output"
          url="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' <<<"$output" | tail -n 1)"
          test -n "$url" || { echo "Wrangler did not return the V3 primary Worker preview URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Upload shared API Worker V3 fallback preview
        id: api-fallback-preview
        shell: bash
        run: |
          output="$(npx wrangler versions upload \
            --config "$V3_WRANGLER_CONFIG" \
            --preview-alias mobile-v3-fallback \
            --keep-vars \
            --message "ARENA V3 fallback $MOBILE_V3_COMMIT_SHA" 2>&1)"
          echo "$output"
          url="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' <<<"$output" | tail -n 1)"
          test -n "$url" || { echo "Wrangler did not return the V3 fallback Worker preview URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify shared API Worker V3 primary preview
        env:
          API_BASE_URL: ${{ steps.api-preview.outputs.url }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --connect-timeout 10 --max-time 30 \
              "$API_BASE_URL/health?commit=$MOBILE_V3_COMMIT_SHA" \
              > /tmp/mobile-v3-primary-health.json \
              && curl -fsSL --connect-timeout 10 --max-time 45 \
                -D /tmp/mobile-v3-primary-schedule.headers \
                "$API_BASE_URL/v1/lol/schedule?states=live,paused,scheduled,unknown" \
                > /tmp/mobile-v3-primary-schedule.json \
              && node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync("/tmp/mobile-v3-primary-health.json", "utf8"));
                const schedule = JSON.parse(fs.readFileSync("/tmp/mobile-v3-primary-schedule.json", "utf8"));
                const headers = fs.readFileSync("/tmp/mobile-v3-primary-schedule.headers", "utf8").toLowerCase();
                const healthy = health.ok === true && health.service === "esports-live-api" && health.adapters?.includes("lol") && health.persistence === "d1";
                const scheduled = schedule.esport === "lol" && Array.isArray(schedule.events);
                const cors = /access-control-allow-origin:\s*\*/.test(headers);
                process.exit(healthy && scheduled && cors ? 0 : 1);
              '; then
              echo "V3 primary API is healthy, D1-backed, and schedule-capable."
              exit 0
            fi
            echo "V3 primary API not ready (attempt $attempt/12)."
            sleep 5
          done
          echo "V3 primary API verification failed."
          exit 1

      - name: Diagnose stale LIVE finality evidence
        continue-on-error: true
        env:
          API_BASE_URL: ${{ steps.api-preview.outputs.url }}
        shell: bash
        run: |
          set -u
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/mobile-v3-primary-schedule.json', 'utf8'));
          const now = Date.now();
          const stale = (payload.events || [])
            .filter(event => ['live', 'paused'].includes(event?.series?.state))
            .filter(event => {
              const start = Date.parse(event?.series?.scheduledStart || '');
              return Number.isFinite(start) && now - start >= 90 * 60 * 1000;
            })
            .sort((a, b) => Date.parse(a.series.scheduledStart) - Date.parse(b.series.scheduledStart))
            .slice(0, 10);
          fs.writeFileSync('/tmp/mobile-v3-stale-series.txt', stale.map(event => event.series.id).join('\n'));
          console.log('STALE LIVE SCHEDULE');
          console.log(JSON.stringify(stale.map(event => ({
            id: event.series.id,
            competition: event.series.competition?.name,
            teams: event.series.teams?.map(team => team.name),
            scheduledStart: event.series.scheduledStart,
            state: event.series.state,
            score: event.series.score?.map(entry => entry.wins) ?? null,
            games: event.series.games?.map(game => ({ number: game.number, state: game.state })) ?? []
          })), null, 2));
          NODE

          while IFS= read -r series_id; do
            [[ -n "$series_id" ]] || continue
            encoded="$(SERIES_ID="$series_id" node -e 'process.stdout.write(encodeURIComponent(process.env.SERIES_ID))')"
            context="$(curl -fsSL --connect-timeout 10 --max-time 60 \
              "$API_BASE_URL/v1/lol/series/$encoded/context?diagnostic=$MOBILE_V3_COMMIT_SHA" || true)"
            SERIES_ID="$series_id" CONTEXT="$context" node <<'NODE'
          const id = process.env.SERIES_ID;
          const text = process.env.CONTEXT || '';
          try {
            const context = JSON.parse(text);
            console.log('STALE LIVE CONTEXT');
            console.log(JSON.stringify({
              seriesId: id,
              observedAt: context.observedAt,
              complete: context.complete,
              reasons: (context.reasons || []).map(reason => ({ code: reason.code, message: reason.message })),
              history: context.history ? {
                bestOf: context.history.bestOf,
                winsRequired: context.history.winsRequired,
                score: context.history.score?.map(entry => ({ team: entry.team?.name, wins: entry.wins })),
                games: context.history.games?.map(game => ({
                  id: game.id,
                  number: game.number,
                  state: game.state,
                  winner: game.winner?.name ?? null,
                  durationSeconds: game.durationSeconds
                }))
              } : null
            }, null, 2));
          } catch {
            console.log(JSON.stringify({ seriesId: id, contextError: text.slice(0, 500) }, null, 2));
          }
          NODE
          done < /tmp/mobile-v3-stale-series.txt

          base='https://lol.fandom.com/api.php'
          siteinfo_status="$(curl -sS -o /tmp/leaguepedia-siteinfo.json -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -G "$base" \
            --data-urlencode 'action=query' \
            --data-urlencode 'format=json' \
            --data-urlencode 'meta=siteinfo' || true)"
          echo "LEAGUEPEDIA SITEINFO HTTP $siteinfo_status"
          head -c 800 /tmp/leaguepedia-siteinfo.json 2>/dev/null || true
          echo

          cargo_status="$(curl -sS -o /tmp/leaguepedia-cargo.json -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -G "$base" \
            --data-urlencode 'action=cargoquery' \
            --data-urlencode 'format=json' \
            --data-urlencode 'limit=1' \
            --data-urlencode 'tables=ScoreboardGames=SG' \
            --data-urlencode 'fields=SG.MatchId=MatchId,SG.Team1=Team1,SG.Team2=Team2,SG.WinTeam=WinTeam,SG.N_GameInMatch=N_GameInMatch,SG.DateTime_UTC=DateTime_UTC' || true)"
          echo "LEAGUEPEDIA CARGO HTTP $cargo_status"
          head -c 1200 /tmp/leaguepedia-cargo.json 2>/dev/null || true
          echo

      - name: Verify shared API Worker V3 fallback preview
        env:
          API_FALLBACK_URL: ${{ steps.api-fallback-preview.outputs.url }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --connect-timeout 10 --max-time 30 \
              "$API_FALLBACK_URL/health?commit=$MOBILE_V3_COMMIT_SHA" \
              > /tmp/mobile-v3-fallback-health.json \
              && curl -fsSL --connect-timeout 10 --max-time 45 \
                -D /tmp/mobile-v3-fallback-schedule.headers \
                "$API_FALLBACK_URL/v1/lol/schedule?states=live,paused,scheduled,unknown" \
                > /tmp/mobile-v3-fallback-schedule.json \
              && node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync("/tmp/mobile-v3-fallback-health.json", "utf8"));
                const schedule = JSON.parse(fs.readFileSync("/tmp/mobile-v3-fallback-schedule.json", "utf8"));
                const headers = fs.readFileSync("/tmp/mobile-v3-fallback-schedule.headers", "utf8").toLowerCase();
                const healthy = health.ok === true && health.service === "esports-live-api" && health.adapters?.includes("lol") && health.persistence === "d1";
                const scheduled = schedule.esport === "lol" && Array.isArray(schedule.events);
                const cors = /access-control-allow-origin:\s*\*/.test(headers);
                process.exit(healthy && scheduled && cors ? 0 : 1);
              '; then
              echo "V3 same-commit fallback API is healthy, D1-backed, and schedule-capable."
              exit 0
            fi
            echo "V3 fallback API not ready (attempt $attempt/12)."
            sleep 5
          done
          echo "V3 fallback API verification failed."
          exit 1

      - name: Prepare V3 build metadata
        shell: bash
        run: |
          echo "VITE_BUILD_SHA=$MOBILE_V3_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA_SHORT=${MOBILE_V3_COMMIT_SHA:0:7}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_RUN=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build ARENA V3
        env:
          VITE_API_BASE_URL: ${{ steps.api-preview.outputs.url }}
          VITE_API_FALLBACK_BASE_URL: ${{ steps.api-fallback-preview.outputs.url }}
        shell: bash
        run: |
          npm run build:web-v3
          mkdir -p apps/web-v3/dist/v3
          cp apps/web-v3/dist/index.html apps/web-v3/dist/v3/index.html

      - name: Confirm V3 metadata and same-commit API failover are embedded
        env:
          API_BASE_URL: ${{ steps.api-preview.outputs.url }}
          API_FALLBACK_URL: ${{ steps.api-fallback-preview.outputs.url }}
        shell: bash
        run: |
          grep -R "$API_BASE_URL" apps/web-v3/dist/assets
          grep -R "$API_FALLBACK_URL" apps/web-v3/dist/assets
          if grep -R -q 'mobile-demo-esports-live-api' apps/web-v3/dist/assets; then
            echo "V3 build must not contain the older mobile-demo API fallback."
            exit 1
          fi
          grep -q "$MOBILE_V3_COMMIT_SHA" apps/web-v3/dist/index.html
          grep -q 'name="arena-version" content="v3"' apps/web-v3/dist/index.html
          grep -R 'V3 · ROUTED' apps/web-v3/dist/assets
          grep -q '/\* /index.html 200' apps/web-v3/dist/_redirects

      - name: Deploy ARENA V3 preview
        id: pages-deploy
        shell: bash
        run: |
          output="$(npx wrangler pages deploy apps/web-v3/dist \
            --project-name esports-live \
            --branch mobile-v3 \
            --commit-hash "$MOBILE_V3_COMMIT_SHA" \
            --commit-message "ARENA V3 routed $MOBILE_V3_COMMIT_SHA" 2>&1)"
          echo "$output"
          url="$(grep -Eo 'https://[a-z0-9]+\.esports-live\.pages\.dev' <<<"$output" | head -n 1)"
          test -n "$url" || { echo "Wrangler did not return an immutable Pages deployment URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify ARENA V3 deployment
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.pages-deploy.outputs.url }}
          API_BASE_URL: ${{ steps.api-preview.outputs.url }}
          API_FALLBACK_URL: ${{ steps.api-fallback-preview.outputs.url }}
        shell: bash
        run: |
          immutable_root="$PAGES_DEPLOYMENT_URL/?commit=$MOBILE_V3_COMMIT_SHA"
          immutable_alias="$PAGES_DEPLOYMENT_URL/v3/?commit=$MOBILE_V3_COMMIT_SHA"
          immutable_match="$PAGES_DEPLOYMENT_URL/match/route-smoke/game-smoke?commit=$MOBILE_V3_COMMIT_SHA"
          immutable_alias_match="$PAGES_DEPLOYMENT_URL/v3/match/route-smoke/game-smoke?commit=$MOBILE_V3_COMMIT_SHA"
          branch_root="https://mobile-v3.esports-live.pages.dev/?commit=$MOBILE_V3_COMMIT_SHA"
          for attempt in {1..12}; do
            html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$immutable_root" || true)"
            alias_html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$immutable_alias" || true)"
            match_html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$immutable_match" || true)"
            alias_match_html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$immutable_alias_match" || true)"
            branch_html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$branch_root" || true)"
            asset="$(grep -Eo 'src="[^"]+assets/[^"]+\.js"' <<<"$html" | head -n 1 | cut -d'"' -f2)"
            if [[ "$asset" == /* ]]; then asset="$PAGES_DEPLOYMENT_URL$asset"; fi
            script="$(curl -fsSL --connect-timeout 10 --max-time 30 "$asset" || true)"

            if grep -q 'name="arena-version" content="v3"' <<<"$html" \
              && grep -q "$MOBILE_V3_COMMIT_SHA" <<<"$html" \
              && grep -q 'V3 · ROUTED' <<<"$script" \
              && grep -q "$API_BASE_URL" <<<"$script" \
              && grep -q "$API_FALLBACK_URL" <<<"$script" \
              && ! grep -q 'mobile-demo-esports-live-api' <<<"$script" \
              && grep -q 'name="arena-version" content="v3"' <<<"$alias_html" \
              && grep -q 'name="arena-version" content="v3"' <<<"$match_html" \
              && grep -q 'name="arena-version" content="v3"' <<<"$alias_match_html" \
              && grep -q "$MOBILE_V3_COMMIT_SHA" <<<"$branch_html"; then
              exit 0
            fi
            sleep 5
          done
          echo "ARENA V3 deployment verification failed."
          exit 1

      - name: Publish V3 application status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$DEPLOY_JOB_STATUS" == "success" ]]; then
            state="success"
            description="ARENA V3 routed preview deployed"
          else
            state="failure"
            description="ARENA V3 routed preview deployment failed"
          fi
          STATE="$state" DESCRIPTION="$description" node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/mobile-v3-status.json", JSON.stringify({
              state: process.env.STATE,
              context: "esports-live/mobile-v3-preview",
              description: process.env.DESCRIPTION,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/mobile-v3-status.json \
            || echo "GitHub status API unavailable; deployment verification result remains authoritative."
