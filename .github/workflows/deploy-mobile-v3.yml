name: Deploy Mobile V3 Preview

on:
  push:
    branches:
      - mobile-v3
    paths:
      - apps/web-v3/**
      - apps/api/**
      - packages/**
      - tests/web/web-v2-*.spec.ts
      - tests/web/web-v3-*.spec.ts
      - package.json
      - package-lock.json
      - playwright.config.ts
      - tsconfig.json
      - wrangler.toml
      - .github/workflows/build-mobile-v3-android-release.yml
      - .github/workflows/deploy-mobile-v3.yml
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: mobile-v3-deploy
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  MOBILE_V3_COMMIT_SHA: ${{ github.sha }}
  MOBILE_V3_VERSION: 0.1.0
  V3_API_FALLBACK_URL: https://mobile-demo-esports-live-api.acchtt.workers.dev

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Mark V3 preview pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/mobile-v3-status.json", JSON.stringify({
              state: "pending",
              context: "esports-live/mobile-v3-preview",
              description: "ARENA V3 routed validation is running",
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/mobile-v3-status.json \
            || echo "GitHub status API unavailable; continuing with V3 validation."

      - name: Check deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$V3_API_FALLBACK_URL" || { echo "Missing V3_API_FALLBACK_URL"; exit 1; }

      - name: Check out V3 application
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        # GitHub's hosted Ubuntu image already carries Chromium's system libraries.
        # Avoid Playwright --with-deps here so a transient Ubuntu apt mirror outage
        # cannot block otherwise healthy V3 browser validation and deployment.
        run: npx playwright install chromium

      - name: Validate shared application code
        run: npm run check

      - name: Validate ARENA V3
        run: npm run test:web-v3

      - name: Enable Worker preview URLs
        run: npx wrangler triggers deploy

      - name: Upload shared API Worker V3 preview
        id: api-preview
        shell: bash
        run: |
          output="$(npx wrangler versions upload \
            --preview-alias mobile-v3-routed \
            --keep-vars \
            --message "ARENA V3 routed $MOBILE_V3_COMMIT_SHA" 2>&1)"
          echo "$output"
          url="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' <<<"$output" | tail -n 1)"
          test -n "$url" || { echo "Wrangler did not return a Worker preview URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify shared API Worker V3 preview
        env:
          API_BASE_URL: ${{ steps.api-preview.outputs.url }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --connect-timeout 10 --max-time 30 "$API_BASE_URL/health?commit=$MOBILE_V3_COMMIT_SHA" > /tmp/mobile-v3-health.json \
              && node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync("/tmp/mobile-v3-health.json", "utf8"));
                process.exit(value.ok === true && value.service === "esports-live-api" && value.adapters?.includes("lol") ? 0 : 1);
              '; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "V3 API preview health verification failed."
              exit 1
            fi
            sleep 5
          done

          # A preview-version schedule route can be intermittently unreachable even
          # when /health is healthy. Probe it here for visibility, while the verified
          # stable fallback below remains the release safety net.
          if curl -fsSL --connect-timeout 10 --max-time 45 \
            -D /tmp/mobile-v3-primary-schedule.headers \
            "$API_BASE_URL/v1/lol/schedule?states=live,paused,scheduled,unknown" \
            > /tmp/mobile-v3-primary-schedule.json \
            && node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync("/tmp/mobile-v3-primary-schedule.json", "utf8"));
              process.exit(value.esport === "lol" && Array.isArray(value.events) ? 0 : 1);
            '; then
            echo "V3 primary schedule probe passed."
          else
            echo "V3 primary schedule probe failed; browser failover will use the verified stable API."
          fi

      - name: Verify V3 stable API fallback
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --connect-timeout 10 --max-time 30 \
              "$V3_API_FALLBACK_URL/health?commit=$MOBILE_V3_COMMIT_SHA" \
              > /tmp/mobile-v3-fallback-health.json \
              && curl -fsSL --connect-timeout 10 --max-time 45 \
                -D /tmp/mobile-v3-fallback-schedule.headers \
                "$V3_API_FALLBACK_URL/v1/lol/schedule?states=live,paused,scheduled,unknown" \
                > /tmp/mobile-v3-fallback-schedule.json \
              && node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync("/tmp/mobile-v3-fallback-health.json", "utf8"));
                const schedule = JSON.parse(fs.readFileSync("/tmp/mobile-v3-fallback-schedule.json", "utf8"));
                const headers = fs.readFileSync("/tmp/mobile-v3-fallback-schedule.headers", "utf8").toLowerCase();
                const healthy = health.ok === true && health.service === "esports-live-api" && health.adapters?.includes("lol");
                const scheduled = schedule.esport === "lol" && Array.isArray(schedule.events);
                const cors = /access-control-allow-origin:\s*\*/.test(headers);
                process.exit(healthy && scheduled && cors ? 0 : 1);
              '; then
              echo "V3 stable API fallback is healthy and schedule-capable."
              exit 0
            fi
            echo "V3 fallback API not ready (attempt $attempt/12)."
            sleep 5
          done
          echo "V3 stable API fallback verification failed."
          exit 1

      - name: Prepare V3 build metadata
        shell: bash
        run: |
          echo "VITE_BUILD_SHA=$MOBILE_V3_COMMIT_SHA" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA_SHORT=${MOBILE_V3_COMMIT_SHA:0:7}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_RUN=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build ARENA V3
        env:
          VITE_API_BASE_URL: ${{ steps.api-preview.outputs.url }}
          VITE_API_FALLBACK_BASE_URL: ${{ env.V3_API_FALLBACK_URL }}
        shell: bash
        run: |
          npm run build:web-v3
          mkdir -p apps/web-v3/dist/v3
          cp apps/web-v3/dist/index.html apps/web-v3/dist/v3/index.html

      - name: Confirm V3 metadata and API failover are embedded
        env:
          API_BASE_URL: ${{ steps.api-preview.outputs.url }}
        shell: bash
        run: |
          grep -R "$API_BASE_URL" apps/web-v3/dist/assets
          grep -R "$V3_API_FALLBACK_URL" apps/web-v3/dist/assets
          grep -q "$MOBILE_V3_COMMIT_SHA" apps/web-v3/dist/index.html
          grep -q 'name="arena-version" content="v3"' apps/web-v3/dist/index.html
          grep -R 'V3 · ROUTED' apps/web-v3/dist/assets
          grep -q '/\* /index.html 200' apps/web-v3/dist/_redirects

      - name: Deploy ARENA V3 preview
        id: pages-deploy
        shell: bash
        run: |
          output="$(npx wrangler pages deploy apps/web-v3/dist \
            --project-name esports-live \
            --branch mobile-v3 \
            --commit-hash "$MOBILE_V3_COMMIT_SHA" \
            --commit-message "ARENA V3 routed $MOBILE_V3_COMMIT_SHA" 2>&1)"
          echo "$output"
          url="$(grep -Eo 'https://[a-z0-9]+\.esports-live\.pages\.dev' <<<"$output" | head -n 1)"
          test -n "$url" || { echo "Wrangler did not return an immutable Pages deployment URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify ARENA V3 deployment
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.pages-deploy.outputs.url }}
        shell: bash
        run: |
          immutable_root="$PAGES_DEPLOYMENT_URL/?commit=$MOBILE_V3_COMMIT_SHA"
          immutable_alias="$PAGES_DEPLOYMENT_URL/v3/?commit=$MOBILE_V3_COMMIT_SHA"
          immutable_match="$PAGES_DEPLOYMENT_URL/match/route-smoke/game-smoke?commit=$MOBILE_V3_COMMIT_SHA"
          immutable_alias_match="$PAGES_DEPLOYMENT_URL/v3/match/route-smoke/game-smoke?commit=$MOBILE_V3_COMMIT_SHA"
          branch_root="https://mobile-v3.esports-live.pages.dev/?commit=$MOBILE_V3_COMMIT_SHA"
          for attempt in {1..12}; do
            html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$immutable_root" || true)"
            alias_html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$immutable_alias" || true)"
            match_html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$immutable_match" || true)"
            alias_match_html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$immutable_alias_match" || true)"
            branch_html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$branch_root" || true)"
            asset="$(grep -Eo 'src="[^"]+assets/[^"]+\.js"' <<<"$html" | head -n 1 | cut -d'"' -f2)"
            if [[ "$asset" == /* ]]; then asset="$PAGES_DEPLOYMENT_URL$asset"; fi
            script="$(curl -fsSL --connect-timeout 10 --max-time 30 "$asset" || true)"

            if grep -q 'name="arena-version" content="v3"' <<<"$html" \
              && grep -q "$MOBILE_V3_COMMIT_SHA" <<<"$html" \
              && grep -q 'V3 · ROUTED' <<<"$script" \
              && grep -q "$V3_API_FALLBACK_URL" <<<"$script" \
              && grep -q 'name="arena-version" content="v3"' <<<"$alias_html" \
              && grep -q 'name="arena-version" content="v3"' <<<"$match_html" \
              && grep -q 'name="arena-version" content="v3"' <<<"$alias_match_html" \
              && grep -q "$MOBILE_V3_COMMIT_SHA" <<<"$branch_html"; then
              exit 0
            fi
            sleep 5
          done
          echo "ARENA V3 deployment verification failed."
          exit 1

      - name: Publish V3 application status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [[ "$DEPLOY_JOB_STATUS" == "success" ]]; then
            state="success"
            description="ARENA V3 routed preview deployed"
          else
            state="failure"
            description="ARENA V3 routed preview deployment failed"
          fi
          STATE="$state" DESCRIPTION="$description" node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/mobile-v3-status.json", JSON.stringify({
              state: process.env.STATE,
              context: "esports-live/mobile-v3-preview",
              description: process.env.DESCRIPTION,
              target_url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            }));
          '
          curl -fsSL --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/mobile-v3-status.json \
            || echo "GitHub status API unavailable; deployment verification result remains authoritative."
