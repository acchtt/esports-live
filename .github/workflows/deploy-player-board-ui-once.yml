name: Deploy Player Board UI Once

on:
  pull_request:
    paths:
      - .github/workflows/deploy-player-board-ui-once.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e7498416c2ed2de3cac50e9cbac073c87c68cffb
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Validate merged release
        run: npm run check
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Deploy Pages with retry
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npx wrangler pages deploy apps/web/dist --project-name esports-live --branch main --commit-hash e7498416c2ed2de3cac50e9cbac073c87c68cffb --commit-message "Restore match history and redesign player boards"; then exit 0; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Verify production UI release
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const web = 'https://esports-live.pages.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function text(url) {
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response.text();
          }

          const localHtml = fs.readFileSync('apps/web/dist/index.html', 'utf8');
          const expectedAsset = localHtml.match(/<script[^>]+src="([^"]+\.js)"/)?.[1];
          if (!expectedAsset) throw new Error('Built JavaScript asset was not found.');
          if (!localHtml.includes('id="quality-banner"')) throw new Error('Built HTML is missing quality-banner.');

          let productionHtml = '';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            productionHtml = await text(`${web}/?release=${Date.now()}`).catch(() => '');
            if (productionHtml.includes(expectedAsset) && productionHtml.includes('id="quality-banner"')) break;
            await sleep(4000);
          }
          if (!productionHtml.includes(expectedAsset)) {
            throw new Error(`Expected production asset did not propagate: ${expectedAsset}`);
          }
          if (!productionHtml.includes('id="quality-banner"')) {
            throw new Error('Production HTML is missing quality-banner.');
          }

          const bundle = await text(`${new URL(expectedAsset, web)}?release=${Date.now()}`);
          const markers = {
            historyLabel: bundle.includes('Match History'),
            historyAria: bundle.includes('Open match history'),
            dataDragon: bundle.includes('ddragon.leagueoflegends.com/cdn'),
            playerBoard: bundle.includes('telemetry-player-board'),
            inventorySlots: bundle.includes('telemetry-item-slot')
          };
          if (Object.values(markers).some(value => !value)) {
            throw new Error(`Production bundle markers missing: ${JSON.stringify(markers)}`);
          }

          console.log(`PRODUCTION_UI_REPORT=${JSON.stringify({ expectedAsset, markers })}`);
          NODE
