name: Verify Player Board UI Release

on:
  pull_request:
    paths:
      - .github/workflows/deploy-player-board-ui-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify production UI release
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const web = 'https://esports-live.pages.dev';
          const expectedAsset = '/assets/index-CeAYVN70.js';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function text(url) {
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response.text();
          }

          let productionHtml = '';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            productionHtml = await text(`${web}/?release=${Date.now()}`).catch(() => '');
            if (productionHtml.includes(expectedAsset) && productionHtml.includes('id="quality-banner"')) break;
            await sleep(4000);
          }
          if (!productionHtml.includes(expectedAsset)) {
            throw new Error(`Expected production asset did not propagate: ${expectedAsset}`);
          }
          if (!productionHtml.includes('id="quality-banner"')) {
            throw new Error('Production HTML is missing quality-banner.');
          }

          const bundle = await text(`${new URL(expectedAsset, web)}?release=${Date.now()}`);
          const markers = {
            historyLabel: bundle.includes('Match History'),
            historyAria: bundle.includes('Open match history'),
            dataDragon: bundle.includes('ddragon.leagueoflegends.com/cdn'),
            playerBoard: bundle.includes('telemetry-player-board'),
            inventorySlots: bundle.includes('telemetry-item-slot')
          };
          if (Object.values(markers).some(value => !value)) {
            throw new Error(`Production bundle markers missing: ${JSON.stringify(markers)}`);
          }

          console.log(`PRODUCTION_UI_REPORT=${JSON.stringify({ expectedAsset, markers })}`);
          NODE
