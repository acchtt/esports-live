name: Deploy sparse live fix

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    if: github.head_ref == 'ops/deploy-sparse-live-events'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 19a85201eae9cc0d6bad4d7d5ece91e070c23a7d

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${{ vars.VITE_API_BASE_URL }}" || { echo "Missing VITE_API_BASE_URL"; exit 1; }

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate repository
        run: npm run check

      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy API Worker
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run deploy:api; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Verify API and live schedule
        shell: bash
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node --input-type=module - <<'NODE'
          const base = process.env.API_BASE_URL?.replace(/\/$/, '');
          if (!base) throw new Error('VITE_API_BASE_URL is missing.');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          let last = 'no response';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              const healthResponse = await fetch(`${base}/health?release=${Date.now()}`, {
                headers: { 'cache-control': 'no-cache' }
              });
              const healthText = await healthResponse.text();
              if (!healthResponse.ok) {
                last = `health HTTP ${healthResponse.status}: ${healthText.slice(0, 300)}`;
                await sleep(4000);
                continue;
              }
              const health = JSON.parse(healthText);
              if (health?.ok !== true || !Array.isArray(health.adapters) || !health.adapters.includes('lol')) {
                last = `invalid health: ${healthText.slice(0, 300)}`;
                await sleep(4000);
                continue;
              }

              const scheduleResponse = await fetch(
                `${base}/v1/lol/schedule?states=live,paused,scheduled&release=${Date.now()}`,
                { headers: { 'cache-control': 'no-cache' } }
              );
              const scheduleText = await scheduleResponse.text();
              if (!scheduleResponse.ok) {
                last = `schedule HTTP ${scheduleResponse.status}: ${scheduleText.slice(0, 300)}`;
                await sleep(4000);
                continue;
              }
              const schedule = JSON.parse(scheduleText);
              const events = Array.isArray(schedule?.events) ? schedule.events : [];
              const active = events.filter(event => ['live', 'paused'].includes(event?.series?.state));
              const invalid = active.filter(event => {
                const series = event?.series ?? {};
                const teams = Array.isArray(series.teams) ? series.teams : [];
                return !Array.isArray(series.games)
                  || series.games.length === 0
                  || teams.length !== 2
                  || teams.some((team, index) => (
                    team?.id === `team-${index + 1}` || team?.name === `Team ${index + 1}`
                  ));
              });
              if (invalid.length) {
                last = `unresolved live placeholders: ${JSON.stringify(invalid).slice(0, 600)}`;
                await sleep(4000);
                continue;
              }
              console.log(`PRODUCTION_SCHEDULE_VERIFIED=${JSON.stringify({
                base,
                totalEvents: events.length,
                activeEvents: active.length,
                activeSeries: active.map(event => ({
                  id: event.series.id,
                  teams: event.series.teams.map(team => team.name),
                  games: event.series.games.length
                }))
              })}`);
              process.exit(0);
            } catch (error) {
              last = error instanceof Error ? error.message : String(error);
            }
            await sleep(4000);
          }
          throw new Error(`Production API verification failed: ${last}`);
          NODE

      - name: Deploy Pages
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npx wrangler pages deploy apps/web/dist \
              --project-name esports-live \
              --branch main \
              --commit-hash 19a85201eae9cc0d6bad4d7d5ece91e070c23a7d \
              --commit-message "Resolve sparse live schedule events"; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Verify Pages release
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const web = 'https://esports-live.pages.dev';
          const localHtml = fs.readFileSync('apps/web/dist/index.html', 'utf8');
          const expectedJs = localHtml.match(/<script[^>]+src="([^"]+\.js)"/)?.[1];
          const expectedCss = [...localHtml.matchAll(/<link[^>]+href="([^"]+\.css)"/g)].map(match => match[1]);
          if (!expectedJs) throw new Error('Built JavaScript entry is missing.');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          let lastHtml = '';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              const response = await fetch(`${web}/?release=${Date.now()}`, {
                headers: { 'cache-control': 'no-cache' }
              });
              lastHtml = response.ok ? await response.text() : '';
              if (
                response.ok
                && lastHtml.includes(expectedJs)
                && expectedCss.every(asset => lastHtml.includes(asset))
              ) {
                console.log(`PRODUCTION_WEB_VERIFIED=${JSON.stringify({ expectedJs, expectedCss })}`);
                process.exit(0);
              }
            } catch {}
            await sleep(4000);
          }
          throw new Error(`Production did not expose ${expectedJs}. Last HTML: ${lastHtml.slice(0, 300)}`);
          NODE
