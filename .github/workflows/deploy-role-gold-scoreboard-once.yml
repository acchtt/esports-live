name: Deploy Role Gold Scoreboard Once

on:
  pull_request:
    paths:
      - .github/workflows/deploy-role-gold-scoreboard-once.yml

permissions:
  contents: read

concurrency:
  group: deploy-role-gold-scoreboard
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ab049d42af53b8e803084fd6fcd7dd33c36a5727
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: https://esports-live-api.acchtt.workers.dev
      - name: Deploy Pages
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npx wrangler pages deploy apps/web/dist --project-name esports-live --branch main --commit-hash ab049d42af53b8e803084fd6fcd7dd33c36a5727 --commit-message "Redesign live scoreboard with role gold matchups"; then exit 0; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Verify production bundle markers
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const web = 'https://esports-live.pages.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const localHtml = fs.readFileSync('apps/web/dist/index.html', 'utf8');
          const expectedJs = localHtml.match(/<script[^>]+src="([^"]+\.js)"/)?.[1];
          const cssAssets = [...localHtml.matchAll(/<link[^>]+href="([^"]+\.css)"/g)].map(match => match[1]);
          if (!expectedJs || cssAssets.length < 1) throw new Error('Built entry assets are missing.');

          let bundle = '';
          let css = '';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const htmlResponse = await fetch(`${web}/?release=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } }).catch(() => null);
            const html = htmlResponse?.ok ? await htmlResponse.text() : '';
            if (!html.includes(expectedJs) || !cssAssets.every(asset => html.includes(asset))) {
              await sleep(4000);
              continue;
            }
            const jsResponse = await fetch(`${new URL(expectedJs, web)}?release=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } }).catch(() => null);
            const cssResponses = await Promise.all(cssAssets.map(asset => fetch(`${new URL(asset, web)}?release=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } }).catch(() => null)));
            bundle = jsResponse?.ok ? await jsResponse.text() : '';
            css = (await Promise.all(cssResponses.map(async response => response?.ok ? response.text() : ''))).join('\n');
            const ready = bundle.includes('ROLE MATCHUPS')
              && bundle.includes('Gold difference by position')
              && bundle.includes('role-matchup-row')
              && css.includes('role-scoreboard-board')
              && css.includes('role-edge-track')
              && css.includes('min-width:721px');
            if (ready) break;
            await sleep(4000);
          }

          const markers = {
            roleMatchupHeader: bundle.includes('ROLE MATCHUPS'),
            positionGoldDifference: bundle.includes('Gold difference by position'),
            fiveRoleRowTemplate: bundle.includes('role-matchup-row'),
            roleBoardCss: css.includes('role-scoreboard-board'),
            roleEdgeBarCss: css.includes('role-edge-track'),
            mediumWidthRefinement: css.includes('min-width:721px')
          };
          if (Object.values(markers).some(value => !value)) throw new Error(`Production markers missing: ${JSON.stringify(markers)}`);
          console.log(`PRODUCTION_ROLE_SCOREBOARD_MARKERS=${JSON.stringify({ expectedJs, cssAssets, markers })}`);
          NODE
      - name: Install browser verifier
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render role matchup fixture in production
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';

          const now = new Date().toISOString();
          const teams = [
            { id: 'blue', name: 'T1', code: 'T1' },
            { id: 'red', name: 'Gen.G', code: 'GEN' }
          ];
          const series = {
            id: 'fixture-series',
            esport: 'lol',
            competition: { id: 'lck', name: 'LCK', region: 'KR', stage: 'Regular Season' },
            teams,
            bestOf: 3,
            state: 'live',
            scheduledStart: now,
            games: [{ id: 'fixture-game-1', number: 1, state: 'live' }]
          };
          const player = (id, handle, championId, role, kills, deaths, assists, creepScore, totalGold) => ({
            id, handle, championId, role, level: 15, kills, deaths, assists, creepScore, totalGold, items: []
          });
          const snapshot = {
            schemaVersion: '1.0',
            esport: 'lol',
            provider: { id: 'fixture', name: 'Production verifier' },
            series,
            game: series.games[0],
            stats: {
              gameClockSeconds: 1632,
              patch: '16.14.1',
              blue: {
                id: 'blue', name: 'T1', side: 'blue', gold: 54200, kills: 12,
                objectives: { towers: 7, inhibitors: 1, dragons: ['infernal', 'mountain', 'hextech'], barons: 1, heralds: 1 },
                players: [
                  player('b1', 'Doran', 'Renekton', 'TOP', 3, 1, 5, 221, 11240),
                  player('b2', 'Oner', 'Vi', 'JUNGLE', 2, 2, 8, 168, 10310),
                  player('b3', 'Faker', 'Azir', 'MIDDLE', 4, 1, 6, 248, 12190),
                  player('b4', 'Gumayusi', 'Jinx', 'BOTTOM', 3, 0, 4, 276, 12860),
                  player('b5', 'Keria', 'Nautilus', 'UTILITY', 0, 2, 11, 38, 7600)
                ]
              },
              red: {
                id: 'red', name: 'Gen.G', side: 'red', gold: 51340, kills: 8,
                objectives: { towers: 4, inhibitors: 0, dragons: ['ocean'], barons: 0, heralds: 1 },
                players: [
                  player('r1', 'Kiin', 'Gnar', 'TOP', 2, 2, 3, 214, 10620),
                  player('r2', 'Canyon', 'Sejuani', 'JUNGLE', 1, 3, 5, 157, 9620),
                  player('r3', 'Chovy', 'Orianna', 'MID', 3, 1, 2, 257, 11940),
                  player('r4', 'Ruler', 'Aphelios', 'ADC', 2, 2, 3, 269, 12110),
                  player('r5', 'Duro', 'Rakan', 'SUPPORT', 0, 4, 7, 31, 7050)
                ]
              }
            },
            quality: {
              freshness: 'fresh', sourceTimestamp: now, observedAt: now, ageSeconds: 2,
              complete: true, advancing: true, safeForLiveAnalysis: true, reasons: []
            }
          };

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1050 }, deviceScaleFactor: 1 });
          await page.route('https://esports-live-api.acchtt.workers.dev/**', async route => {
            const url = new URL(route.request().url());
            const json = value => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(value) });
            if (url.pathname === '/health') return json({ ok: true, service: 'fixture', schemaVersion: '1.0', adapters: ['lol'] });
            if (url.pathname === '/v1/lol/schedule') {
              if (url.searchParams.get('states')?.includes('completed')) return json({ esport: 'lol', events: [] });
              return json({ esport: 'lol', events: [{ series, provider: { id: 'fixture', name: 'Production verifier' }, observedAt: now }] });
            }
            if (url.pathname.includes('/live')) return json(snapshot);
            if (url.pathname.includes('/context')) return json({ schemaVersion: '1.0', esport: 'lol', seriesId: series.id, provider: snapshot.provider, observedAt: now, rosters: [], standings: [], complete: false, reasons: [] });
            return route.fulfill({ status: 404, contentType: 'application/json', body: JSON.stringify({ message: 'Fixture route unavailable' }) });
          });

          await page.goto(`https://esports-live.pages.dev/?verification=${Date.now()}`, { waitUntil: 'networkidle' });
          await page.locator('.role-scoreboard-board').waitFor({ state: 'visible', timeout: 30000 });
          const rows = page.locator('.role-matchup-row');
          if (await rows.count() !== 5) throw new Error(`Expected 5 role matchup rows, received ${await rows.count()}`);
          if (await page.locator('.role-gold-delta').count() !== 5) throw new Error('Role gold delta cells are incomplete.');
          const boardText = await page.locator('.role-scoreboard-board').innerText();
          for (const label of ['TOP', 'JUNGLE', 'MID', 'BOTTOM', 'SUPPORT', 'TOTAL GOLD']) {
            if (!boardText.toUpperCase().includes(label)) throw new Error(`Missing board label: ${label}`);
          }
          await page.locator('.analysis-panel').screenshot({ path: 'production-role-scoreboard.png' });
          console.log('PRODUCTION_ROLE_SCOREBOARD_RENDERED=true');
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: production-role-scoreboard-verification
          path: production-role-scoreboard.png
          retention-days: 1
