name: Deploy Synchronized Telemetry UI Once

on:
  pull_request:
    paths:
      - .github/workflows/deploy-synchronized-telemetry-ui-once.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 3317856a6c2470641f73d721968a4d11496cf5f3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Deploy Pages
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npx wrangler pages deploy apps/web/dist --project-name esports-live --branch main --commit-hash 3317856a6c2470641f73d721968a4d11496cf5f3 --commit-message "Synchronize telemetry time and simplify live team boards"; then exit 0; fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Verify production bundle
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const web = 'https://esports-live.pages.dev';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const localHtml = fs.readFileSync('apps/web/dist/index.html', 'utf8');
          const expectedAsset = localHtml.match(/<script[^>]+src="([^"]+\.js)"/)?.[1];
          if (!expectedAsset) throw new Error('No built JavaScript asset found.');

          async function fetchText(url) {
            const response = await fetch(url, { headers: { 'cache-control': 'no-cache' } });
            if (!response.ok) throw new Error(`${url} -> ${response.status}`);
            return {
              contentType: response.headers.get('content-type') ?? '',
              text: await response.text()
            };
          }

          let html = '';
          let bundle = '';
          let contentType = '';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const page = await fetchText(`${web}/?release=${Date.now()}`).catch(() => ({ contentType: '', text: '' }));
            html = page.text;
            if (!html.includes(expectedAsset)) {
              await sleep(4000);
              continue;
            }
            const asset = await fetchText(`${new URL(expectedAsset, web)}?release=${Date.now()}`).catch(() => ({ contentType: '', text: '' }));
            contentType = asset.contentType;
            bundle = asset.text;
            const ready = /javascript|ecmascript/i.test(contentType)
              && bundle.includes('TELEMETRY TIME')
              && bundle.includes('objective-icon')
              && bundle.includes('gold-lead')
              && bundle.includes('telemetry-player-board')
              && !bundle.includes('liveClockAdvancing');
            if (ready) break;
            await sleep(4000);
          }

          if (!html.includes(expectedAsset)) throw new Error(`Expected asset is not active: ${expectedAsset}`);
          if (!/javascript|ecmascript/i.test(contentType)) throw new Error(`Asset did not return JavaScript: ${contentType}`);
          const markers = {
            snapshotClock: bundle.includes('TELEMETRY TIME'),
            objectiveIcons: bundle.includes('objective-icon'),
            goldLeadBadge: bundle.includes('gold-lead'),
            symmetricPlayerBoard: bundle.includes('telemetry-player-board'),
            advancingClockRemoved: !bundle.includes('liveClockAdvancing')
          };
          if (Object.values(markers).some(value => !value)) throw new Error(`Missing markers: ${JSON.stringify(markers)}`);
          console.log(`PRODUCTION_SYNCHRONIZED_TELEMETRY_REPORT=${JSON.stringify({ expectedAsset, contentType, markers })}`);
          NODE
