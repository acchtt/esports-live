name: Deploy Verify Context Fix Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-verify-context-fix-once.yml

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$API_BASE_URL" || exit 1
      - run: npm install
      - run: npm run check
      - name: Deploy API Worker
        run: npm run deploy:api
      - name: Verify production contexts
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent "$API_BASE_URL/health" > /dev/null; then break; fi
            sleep 5
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const base = process.env.API_BASE_URL;

          async function getJson(url) {
            try {
              const response = await fetch(url, { headers: { accept: 'application/json' } });
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : null; } catch {}
              return { ok: response.ok, status: response.status, body };
            } catch (error) {
              return { ok: false, status: 0, body: { message: String(error) } };
            }
          }

          const health = await getJson(`${base}/health`);
          const schedule = await getJson(`${base}/v1/lol/schedule?limit=20`);
          const events = Array.isArray(schedule.body?.events) ? schedule.body.events : [];
          const attempts = [];
          let best = null;

          for (const event of events.slice(0, 15)) {
            const series = event?.series;
            if (!series?.id) continue;
            const result = await getJson(`${base}/v1/lol/series/${encodeURIComponent(series.id)}/context`);
            const context = result.body ?? {};
            const rosterCount = Array.isArray(context.rosters) ? context.rosters.length : 0;
            const playerCounts = Array.isArray(context.rosters)
              ? context.rosters.map(roster => Array.isArray(roster.players) ? roster.players.length : 0)
              : [];
            const standingsCount = Array.isArray(context.standings) ? context.standings.length : 0;
            const reasonCodes = Array.isArray(context.reasons)
              ? context.reasons.map(reason => reason.code)
              : [];
            const item = {
              seriesId: series.id,
              competition: series.competition?.name ?? null,
              teams: Array.isArray(series.teams) ? series.teams.map(team => team.name) : [],
              status: result.status,
              message: context.message ?? null,
              complete: context.complete ?? false,
              rosterCount,
              playerCounts,
              standingsCount,
              reasonCodes
            };
            attempts.push(item);
            const score = playerCounts.reduce((sum, count) => sum + count, 0) * 10
              + rosterCount * 5
              + standingsCount;
            if (!best || score > best.score) best = { ...item, score };
            if (rosterCount >= 2 && standingsCount > 0) break;
          }

          const meaningful = Boolean(best && (best.rosterCount > 0 || best.standingsCount > 0));
          const report = {
            status: meaningful ? 'meaningful_context_found' : 'diagnostic_only',
            checkedAt: new Date().toISOString(),
            sourceCommit: process.env.GITHUB_SHA,
            healthStatus: health.status,
            adapters: health.body?.adapters ?? [],
            scheduleStatus: schedule.status,
            scheduleTotal: schedule.body?.page?.total ?? null,
            firstPageCount: events.length,
            nextCursorPresent: Boolean(schedule.body?.page?.nextCursor),
            meaningful,
            best,
            attempts
          };
          fs.mkdirSync('.deployment', { recursive: true });
          fs.writeFileSync(
            '.deployment/lol-context-fix-verification.json',
            JSON.stringify(report, null, 2) + '\n'
          );
          NODE
      - name: Record verification
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add .deployment/lol-context-fix-verification.json
          git commit -m "Record Riot context fix diagnostics"
          git push
