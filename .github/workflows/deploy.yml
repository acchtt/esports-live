name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - api
          - web
          - all

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.target }}" == "web" || "${{ inputs.target }}" == "all" ]]; then
            test -n "${{ vars.VITE_API_BASE_URL }}" || { echo "Missing repository variable VITE_API_BASE_URL"; exit 1; }
          fi

  deploy-api:
    if: github.event_name == 'push' || inputs.target == 'api' || inputs.target == 'all'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - name: Deploy API Worker
        run: npm run deploy:api
      - name: Verify production API
        if: github.event_name == 'push' || inputs.target == 'all'
        env:
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --connect-timeout 10 --max-time 30 \
              "$API_BASE_URL/health?commit=$GITHUB_SHA" > /tmp/production-health.json \
              && node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync("/tmp/production-health.json", "utf8"));
                process.exit(
                  value.ok === true
                    && value.service === "esports-live-api"
                    && Array.isArray(value.adapters)
                    && value.adapters.includes("lol")
                    ? 0
                    : 1
                );
              '; then
              echo "Production API is available at $API_BASE_URL with the LoL adapter enabled."
              exit 0
            fi
            echo "Production API not ready (attempt $attempt/12)."
            cat /tmp/production-health.json 2>/dev/null || true
            sleep 5
          done
          echo "Production API verification failed."
          exit 1

  deploy-web:
    if: always() && needs.validate.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.target == 'web') || ((github.event_name == 'push' || inputs.target == 'all') && needs.deploy-api.result == 'success'))
    needs:
      - validate
      - deploy-api
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Ensure Pages project exists
        shell: bash
        run: |
          projects_json="$(npx wrangler pages project list --json)"
          if PROJECTS_JSON="$projects_json" node -e '
            const parsed = JSON.parse(process.env.PROJECTS_JSON || "[]");
            const projects = Array.isArray(parsed) ? parsed : (parsed.result || parsed.items || []);
            process.exit(projects.some(project => project.name === "esports-live") ? 0 : 1);
          '; then
            echo "Pages project esports-live already exists."
          else
            create_output="$(npx wrangler pages project create esports-live --production-branch main 2>&1)" || {
              if grep -qi 'already exists' <<<"$create_output"; then
                echo "Pages project esports-live already exists."
              else
                echo "$create_output"
                exit 1
              fi
            }
          fi
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Deploy Pages application
        run: >-
          npx wrangler pages deploy apps/web/dist
          --project-name esports-live
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "${{ github.event.head_commit.message || 'Manual production deployment' }}"
      - name: Verify production shell
        shell: bash
        run: |
          url="https://esports-live.pages.dev/?commit=$GITHUB_SHA"
          for attempt in {1..12}; do
            html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$url" || true)"
            if grep -Eq '<title>[^<]*Esports Live</title>' <<<"$html" && grep -q 'class="app-frame' <<<"$html"; then
              echo "Production shell is available at $url"
              exit 0
            fi
            echo "Production shell not ready (attempt $attempt/12)."
            sleep 5
          done
          echo "Production shell verification failed."
          exit 1
