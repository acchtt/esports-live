name: Diagnose Lineup Window

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-lineup-window.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect completed game window metadata
        shell: bash
        run: |
          node - <<'NODE'
          const source = await fetch('https://raw.githubusercontent.com/Aureom/live-lol-esports/main/src/utils/LoLEsportsAPI.ts').then(response => response.text());
          const apiKey = source.match(/API_KEY\s*=\s*["']([^"']+)["']/)?.[1];
          if (!apiKey) throw new Error('Unable to resolve public Riot web API key.');
          console.log(`::add-mask::${apiKey}`);

          const gameIds = [
            '116889604984157238',
            '116889604984157239',
            '116889604984157240',
            '116889604984222870',
            '116889604984222871'
          ];
          const report = [];
          for (const gameId of gameIds) {
            for (const keyed of [false, true]) {
              const url = `https://feed.lolesports.com/livestats/v1/window/${gameId}`;
              const response = await fetch(url, {
                headers: {
                  accept: 'application/json',
                  ...(keyed ? { 'x-api-key': apiKey } : {})
                }
              });
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : null; } catch {}
              const metadata = body?.gameMetadata ?? body?.frames?.at(-1)?.gameMetadata ?? null;
              report.push({
                gameId,
                keyed,
                status: response.status,
                bodyKeys: body && typeof body === 'object' ? Object.keys(body) : [],
                frameCount: Array.isArray(body?.frames) ? body.frames.length : null,
                firstFrameTimestamp: body?.frames?.[0]?.rfc460Timestamp ?? null,
                lastFrameTimestamp: body?.frames?.at(-1)?.rfc460Timestamp ?? null,
                metadataKeys: metadata ? Object.keys(metadata) : [],
                blueTeamId: metadata?.blueTeamMetadata?.esportsTeamId ?? null,
                redTeamId: metadata?.redTeamMetadata?.esportsTeamId ?? null,
                blueParticipants: metadata?.blueTeamMetadata?.participantMetadata ?? null,
                redParticipants: metadata?.redTeamMetadata?.participantMetadata ?? null,
                textPrefix: body ? null : text.slice(0, 200)
              });
            }
          }
          console.log(`LINEUP_WINDOW_REPORT=${JSON.stringify(report)}`);
          NODE
