name: Diagnose Mobile V3 Stale Live

on:
  push:
    branches:
      - mobile-v3
    paths:
      - .github/workflows/diagnose-mobile-v3-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Discover deployed V3 API
        shell: bash
        run: |
          set -euo pipefail
          root='https://mobile-v3.esports-live.pages.dev/'
          html="$(curl -fsSL --connect-timeout 10 --max-time 30 "$root?diagnostic=$GITHUB_SHA")"
          asset="$(grep -Eo 'src="[^"]+assets/[^"]+\.js"' <<<"$html" | head -n 1 | cut -d'"' -f2)"
          if [[ "$asset" == /* ]]; then asset="${root%/}$asset"; fi
          script="$(curl -fsSL --connect-timeout 10 --max-time 30 "$asset")"
          api="$(grep -Eo 'https://[a-z0-9.-]*mobile-v3-routed[a-z0-9.-]*\.workers\.dev' <<<"$script" | head -n 1 || true)"
          if [[ -z "$api" ]]; then
            api="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' <<<"$script" | head -n 1 || true)"
          fi
          test -n "$api" || { echo 'Could not discover deployed V3 Worker URL.'; exit 1; }
          echo "API_BASE_URL=$api" >> "$GITHUB_ENV"
          echo "Discovered deployed V3 API: $api"

      - name: Inspect stale LIVE series contexts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 60 \
            "$API_BASE_URL/v1/lol/schedule?states=live,paused,scheduled,unknown&diagnostic=$GITHUB_SHA" \
            > /tmp/v3-schedule.json

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/v3-schedule.json', 'utf8'));
          const now = Date.now();
          const stale = (payload.events || [])
            .filter(event => ['live', 'paused'].includes(event?.series?.state))
            .filter(event => {
              const start = Date.parse(event?.series?.scheduledStart || '');
              return Number.isFinite(start) && now - start >= 90 * 60 * 1000;
            })
            .sort((a, b) => Date.parse(a.series.scheduledStart) - Date.parse(b.series.scheduledStart))
            .slice(0, 10);
          fs.writeFileSync('/tmp/v3-stale-series.txt', stale.map(event => event.series.id).join('\n'));
          console.log(JSON.stringify(stale.map(event => ({
            id: event.series.id,
            competition: event.series.competition?.name,
            teams: event.series.teams?.map(team => team.name),
            scheduledStart: event.series.scheduledStart,
            state: event.series.state,
            score: event.series.score?.map(entry => entry.wins) ?? null,
            games: event.series.games?.map(game => ({ number: game.number, state: game.state })) ?? []
          })), null, 2));
          NODE

          while IFS= read -r series_id; do
            [[ -n "$series_id" ]] || continue
            encoded="$(SERIES_ID="$series_id" node -e 'process.stdout.write(encodeURIComponent(process.env.SERIES_ID))')"
            context="$(curl -fsSL --connect-timeout 10 --max-time 60 \
              "$API_BASE_URL/v1/lol/series/$encoded/context?diagnostic=$GITHUB_SHA" || true)"
            SERIES_ID="$series_id" CONTEXT="$context" node <<'NODE'
          const id = process.env.SERIES_ID;
          const text = process.env.CONTEXT || '';
          try {
            const context = JSON.parse(text);
            console.log(JSON.stringify({
              seriesId: id,
              observedAt: context.observedAt,
              complete: context.complete,
              reasons: (context.reasons || []).map(reason => ({ code: reason.code, message: reason.message })),
              history: context.history ? {
                bestOf: context.history.bestOf,
                winsRequired: context.history.winsRequired,
                score: context.history.score?.map(entry => ({ team: entry.team?.name, wins: entry.wins })),
                games: context.history.games?.map(game => ({
                  id: game.id,
                  number: game.number,
                  state: game.state,
                  winner: game.winner?.name ?? null,
                  durationSeconds: game.durationSeconds
                }))
              } : null
            }, null, 2));
          } catch {
            console.log(JSON.stringify({ seriesId: id, contextError: text.slice(0, 500) }, null, 2));
          }
          NODE
          done < /tmp/v3-stale-series.txt

      - name: Probe Leaguepedia Cargo source
        shell: bash
        run: |
          set -euo pipefail
          base='https://lol.fandom.com/api.php'
          status="$(curl -sS -o /tmp/leaguepedia-siteinfo.json -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -G "$base" \
            --data-urlencode 'action=query' \
            --data-urlencode 'format=json' \
            --data-urlencode 'meta=siteinfo' || true)"
          echo "Leaguepedia siteinfo HTTP: $status"
          head -c 800 /tmp/leaguepedia-siteinfo.json || true
          echo

          cargo_status="$(curl -sS -o /tmp/leaguepedia-cargo.json -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -G "$base" \
            --data-urlencode 'action=cargoquery' \
            --data-urlencode 'format=json' \
            --data-urlencode 'limit=1' \
            --data-urlencode 'tables=ScoreboardGames=SG' \
            --data-urlencode 'fields=SG.MatchId=MatchId,SG.Team1=Team1,SG.Team2=Team2,SG.WinTeam=WinTeam,SG.N_GameInMatch=N_GameInMatch,SG.DateTime_UTC=DateTime_UTC' || true)"
          echo "Leaguepedia Cargo HTTP: $cargo_status"
          head -c 1200 /tmp/leaguepedia-cargo.json || true
          echo
