name: Diagnose Objective Atlas Columns Once

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-columns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pillow
      - name: Download scoreboard atlas
        run: curl -fL --retry 4 --retry-delay 3 https://raw.communitydragon.org/latest/game/assets/ux/scoreboard/scoreboardatlas.png -o /tmp/scoreboardatlas.png
      - name: Analyze target glyph regions
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque

          image = Image.open('/tmp/scoreboardatlas.png').convert('RGBA')
          alpha = image.getchannel('A')
          x0, x1, y0, y1 = 26*64, 30*64, 0, 64
          pixels = alpha.load()
          occupied = []
          for x in range(x0, x1):
              occupied.append(any(pixels[x, y] > 8 for y in range(y0, y1)))
          runs=[]
          start=None
          for index, value in enumerate(occupied + [False]):
              if value and start is None:
                  start=index
              elif not value and start is not None:
                  runs.append((x0+start, x0+index-1, index-start))
                  start=None
          print('COLUMN_RUNS', runs)

          mask={(x,y) for x in range(x0,x1) for y in range(y0,y1) if pixels[x,y] > 8}
          components=[]
          while mask:
              seed=mask.pop(); q=deque([seed]); xs=[]; ys=[]
              while q:
                  x,y=q.popleft(); xs.append(x); ys.append(y)
                  for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                      if (nx,ny) in mask:
                          mask.remove((nx,ny)); q.append((nx,ny))
              if len(xs) >= 3:
                  components.append((len(xs),(min(xs),min(ys),max(xs)+1,max(ys)+1)))
          components.sort(reverse=True)
          print('COMPONENTS', components[:30])
          PY
