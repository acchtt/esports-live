name: Diagnose Objective Icons Once

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pillow
      - name: Verify and render objective icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          files = ['tower.png', 'dragon.png', 'baron.png', 'herald.png', 'inhibitor.png']
          root = Path('apps/web/public/objectives')
          canvas = Image.new('RGB', (5 * 180, 180), '#08101f')
          draw = ImageDraw.Draw(canvas)
          for index, name in enumerate(files):
              path = root / name
              with Image.open(path) as image:
                  image.load()
                  rgba = image.convert('RGBA')
                  alpha = rgba.getchannel('A')
                  bbox = alpha.getbbox()
                  extrema = alpha.getextrema()
                  print(f'{name}: size={rgba.size} mode={rgba.mode} bbox={bbox} alpha={extrema} bytes={path.stat().st_size}')
                  if bbox is None:
                      raise SystemExit(f'{name} is fully transparent')
                  preview = rgba.copy()
                  preview.thumbnail((112, 112), Image.Resampling.LANCZOS)
                  x = index * 180 + (180 - preview.width) // 2
                  y = 18 + (112 - preview.height) // 2
                  canvas.paste(preview, (x, y), preview)
                  draw.text((index * 180 + 10, 145), name, fill='white')
          canvas.save('objective-icons-preview.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: objective-icons-preview
          path: objective-icons-preview.png
          retention-days: 1
