name: Diagnose Series History Accuracy

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-series-history-accuracy.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Inspect production history and Riot window fields
        shell: bash
        run: |
          node - <<'NODE'
          const apiBase = 'https://esports-live-api.acchtt.workers.dev';
          const liveBase = 'https://feed.lolesports.com/livestats/v1';
          const obj = value => value && typeof value === 'object' && !Array.isArray(value) ? value : {};
          const arr = value => Array.isArray(value) ? value : [];
          const pick = (source, keys) => Object.fromEntries(keys.filter(key => source[key] !== undefined).map(key => [key, source[key]]));

          async function getJson(url) {
            const response = await fetch(url, { headers: { accept: 'application/json', 'cache-control': 'no-cache' } });
            const text = await response.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; } catch {}
            return { status: response.status, body, text: body ? null : text.slice(0, 300) };
          }

          const schedule = await getJson(`${apiBase}/v1/lol/schedule?states=live,paused,scheduled&limit=80&probe=${Date.now()}`);
          const events = arr(obj(schedule.body).events);
          const targets = events.map(obj).filter(entry => ['live', 'paused'].includes(String(obj(entry.series).state))).slice(0, 4);
          console.log(`LIVE_SERIES_COUNT=${targets.length}`);

          for (const entry of targets) {
            const series = obj(entry.series);
            const seriesId = String(series.id ?? '');
            const games = arr(series.games).map(obj);
            const context = await getJson(`${apiBase}/v1/lol/series/${encodeURIComponent(seriesId)}/context?probe=${Date.now()}`);
            console.log(`CONTEXT_REPORT=${JSON.stringify({
              seriesId,
              teams: arr(series.teams).map(team => pick(obj(team), ['id', 'name', 'code'])),
              bestOf: series.bestOf,
              state: series.state,
              games: games.map(game => pick(game, ['id', 'number', 'state'])),
              history: obj(context.body).history ?? null
            })}`);

            for (const rawGame of games) {
              const gameId = String(rawGame.id ?? '');
              if (!gameId) continue;
              const windowResult = await getJson(`${liveBase}/window/${encodeURIComponent(gameId)}`);
              const payload = obj(windowResult.body);
              const frames = arr(payload.frames ?? obj(payload.window).frames ?? obj(payload.data).frames).map(obj);
              const frame = frames.at(-1) ?? {};
              const metadata = obj(payload.gameMetadata ?? frame.gameMetadata);
              const blue = obj(frame.blueTeam);
              const red = obj(frame.redTeam);
              console.log(`WINDOW_REPORT=${JSON.stringify({
                seriesId,
                gameId,
                listedState: rawGame.state,
                status: windowResult.status,
                payloadKeys: Object.keys(payload).sort(),
                frameCount: frames.length,
                firstFrame: frames[0] ? pick(frames[0], ['rfc460Timestamp', 'timestamp', 'gameState', 'state', 'gameClockSeconds', 'gameTimeSeconds']) : null,
                lastFrame: pick(frame, ['rfc460Timestamp', 'timestamp', 'gameState', 'state', 'winningTeam', 'winnerTeamId', 'winningTeamId', 'winnerId', 'gameClockSeconds', 'gameTimeSeconds']),
                frameKeys: Object.keys(frame).sort(),
                metadataKeys: Object.keys(metadata).sort(),
                metadata: pick(metadata, ['esportsMatchId', 'gameStartTime', 'startTime', 'patchVersion', 'gameVersion', 'winningTeam', 'winnerTeamId', 'winningTeamId', 'winnerId', 'gameState', 'state']),
                blue: pick(blue, ['esportsTeamId', 'teamID', 'teamId', 'id', 'result', 'outcome', 'win', 'winner', 'totalGold', 'totalKills', 'towers', 'inhibitors']),
                red: pick(red, ['esportsTeamId', 'teamID', 'teamId', 'id', 'result', 'outcome', 'win', 'winner', 'totalGold', 'totalKills', 'towers', 'inhibitors'])
              })}`);
            }
          }
          NODE
