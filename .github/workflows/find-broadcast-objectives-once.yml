name: Find Broadcast Objective Assets Once

on:
  push:
    paths:
      - .github/workflows/find-broadcast-objectives-once.yml

permissions:
  contents: write

jobs:
  find-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/broadcast-objective-icons-no-side-gold
          fetch-depth: 0

      - name: Search CommunityDragon UI trees
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          roots = [
              'game/assets/ux/scoreboard',
              'game/assets/ux/spectator',
              'plugins/rcp-fe-lol-esports-observer',
          ]
          needles = ('tower', 'turret', 'dragon', 'baron', 'herald', 'inhib', 'objective')
          max_depth = {'game/assets/ux/scoreboard': 3, 'game/assets/ux/spectator': 3, 'plugins/rcp-fe-lol-esports-observer': 7}
          seen = set()
          matches = []
          listings = []

          def fetch(path):
              url = f'https://raw.communitydragon.org/json/latest/{path.strip("/")}/'
              req = urllib.request.Request(url, headers={'User-Agent': 'esports-live-build/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          def entries(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ('entries', 'files', 'items', 'children'):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value
              return []

          def walk(root, path, depth):
              if path in seen or depth > max_depth[root]: return
              seen.add(path)
              try:
                  payload = fetch(path)
              except Exception as exc:
                  listings.append(f'ERROR {path}: {exc}')
                  return
              rows = entries(payload)
              listings.append(f'DIR {path} entries={len(rows)}')
              for row in rows:
                  if not isinstance(row, dict): continue
                  name = str(row.get('name') or row.get('path') or row.get('file') or '')
                  if not name: continue
                  lower = name.lower()
                  full = f'{path.rstrip("/")}/{name.lstrip("/")}'
                  is_dir = bool(row.get('isDirectory') or row.get('directory') or row.get('type') in ('directory','dir') or name.endswith('/'))
                  if any(token in lower for token in needles):
                      matches.append(full)
                  if is_dir:
                      walk(root, full.rstrip('/'), depth + 1)

          for root in roots:
              walk(root, root, 0)

          out = Path('broadcast-objective-asset-report.txt')
          out.write_text('\n'.join(['MATCHES', *sorted(set(matches)), '', 'LISTINGS', *listings]), encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Commit report
        shell: bash
        run: |
          rm .github/workflows/find-broadcast-objectives-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Report Riot broadcast objective assets"
          git push origin HEAD:fix/broadcast-objective-icons-no-side-gold
