name: Fix Eager Prewarm Placement Once

on:
  push:
    branches:
      - fix/eager-data-preload

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.ref == 'refs/heads/fix/eager-data-preload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/eager-data-preload
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Move Data Dragon prewarm to startup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/completed-match-player-board-view.ts')
          text = path.read_text()
          old = """    if (rerun) {
              rerun = false;
              void version();
        queue();
            }
          """
          new = """    if (rerun) {
              rerun = false;
              queue();
            }
          """
          if old not in text:
              raise SystemExit('Misplaced prewarm block not found')
          text = text.replace(old, new, 1)
          old_end = """}).observe(document.body,{childList:true,subtree:true});
          queue();
          """
          new_end = """}).observe(document.body,{childList:true,subtree:true});
          void version();
          queue();
          """
          if old_end not in text:
              raise SystemExit('Startup queue block not found')
          path.write_text(text.replace(old_end, new_end, 1))
          PY
      - run: npm install --no-package-lock
      - run: npm run check
      - run: npm run build:web
      - name: Commit correction
        shell: bash
        run: |
          rm -f package-lock.json .github/workflows/fix-eager-prewarm-placement-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/completed-match-player-board-view.ts .github/workflows/fix-eager-prewarm-placement-once.yml
          git commit -m "Prewarm Data Dragon at startup"
          git push origin HEAD:fix/eager-data-preload
