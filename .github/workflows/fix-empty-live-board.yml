name: Fix empty live board

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.head_ref == 'agent/fix-empty-live-board'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-empty-live-board
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Add missing-game recovery and fallback
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/main.ts')
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:80]}')
              source = source.replace(old, new, 1)

          replace_once(
              "import type { LiveSnapshot, ScheduleEvent, SeriesGameRef } from '@esports-live/core';",
              "import type { LiveSnapshot, ScheduleEvent, SeriesContext, SeriesGameRef } from '@esports-live/core';"
          )
          replace_once(
              "const COMPLETED_SNAPSHOT_CACHE_MS = 30 * 60 * 1_000;",
              "const COMPLETED_SNAPSHOT_CACHE_MS = 30 * 60 * 1_000;\nconst SERIES_CONTEXT_CACHE_MS = 45_000;"
          )
          replace_once(
              "const completedSnapshotRequests = new Map<string, Promise<LiveSnapshot<LolStats>>>();",
              "const completedSnapshotRequests = new Map<string, Promise<LiveSnapshot<LolStats>>>();\nconst seriesContextCache = new Map<string, { expiresAt: number; value: SeriesContext }>();\nconst seriesContextRequests = new Map<string, Promise<SeriesContext>>();"
          )

          api_block = """async function api<T>(path: string): Promise<T> {
            const response = await fetch(`${API_BASE}${path}`, { cache: 'no-store' });
            if (!response.ok) {
              const body = await response.json().catch(() => null) as { message?: string } | null;
              throw new Error(body?.message ?? `API returned ${response.status}`);
            }
            return response.json() as Promise<T>;
          }
          """
          replace_once(api_block, api_block + """
          async function seriesContextFor(seriesId: string): Promise<SeriesContext> {
            const cached = seriesContextCache.get(seriesId);
            if (cached && cached.expiresAt > Date.now()) return cached.value;
            const pending = seriesContextRequests.get(seriesId);
            if (pending) return pending;
            const request = api<SeriesContext>(
              `/v1/lol/series/${encodeURIComponent(seriesId)}/context?live=${Date.now()}`
            ).then(value => {
              seriesContextCache.set(seriesId, {
                value,
                expiresAt: Date.now() + SERIES_CONTEXT_CACHE_MS
              });
              return value;
            }).finally(() => seriesContextRequests.delete(seriesId));
            seriesContextRequests.set(seriesId, request);
            return request;
          }

          async function hydrateMissingGames(event: ScheduleEvent): Promise<ScheduleEvent> {
            if (event.series.games.length || !['live', 'paused'].includes(event.series.state)) return event;
            try {
              const context = await seriesContextFor(event.series.id);
              const history = context.history;
              if (!history?.games.length) return event;
              const [left, right] = history.score;
              return {
                ...event,
                series: {
                  ...event.series,
                  teams: [left.team, right.team],
                  bestOf: history.bestOf,
                  games: history.games
                    .map(({ id, number, state }) => ({ id, number, state }))
                    .sort((a, b) => a.number - b.number)
                }
              };
            } catch {
              return event;
            }
          }
          """)

          selector = """function renderGameSelector(event: ScheduleEvent): void {
            gameSelector.innerHTML = event.series.games.map(game => `
              <button type=\"button\" class=\"game-button ${game.id === selectedGameId ? 'active' : ''} ${game.state}\"
                data-game-id=\"${escapeHtml(game.id)}\">
                G${game.number}<span>${escapeHtml(game.state)}</span>
              </button>`).join('');
            gameSelector.querySelectorAll<HTMLButtonElement>('[data-game-id]').forEach(button => {
              button.addEventListener('click', () => selectGame(button.dataset.gameId ?? ''));
            });
          }
          """
          replace_once(selector, """function renderGameSelector(event: ScheduleEvent): void {
            if (!event.series.games.length) {
              gameSelector.innerHTML = '<span class=\"game-selector-empty\">Game feed pending</span>';
              return;
            }
            gameSelector.innerHTML = event.series.games.map(game => `
              <button type=\"button\" class=\"game-button ${game.id === selectedGameId ? 'active' : ''} ${game.state}\"
                data-game-id=\"${escapeHtml(game.id)}\">
                G${game.number}<span>${escapeHtml(game.state)}</span>
              </button>`).join('');
            gameSelector.querySelectorAll<HTMLButtonElement>('[data-game-id]').forEach(button => {
              button.addEventListener('click', () => selectGame(button.dataset.gameId ?? ''));
            });
          }
          """)

          upcoming = """function renderUpcoming(event: ScheduleEvent): void {
            renderedGameId = null;
            clearLiveClock();
            gameContent.innerHTML = `
              <div class=\"analysis-empty\">
                <span class=\"analysis-empty-icon\" aria-hidden=\"true\">◷</span>
                <h3>Match scheduled</h3>
                <p>${escapeHtml(formatTime(event.series.scheduledStart))}. Live telemetry will start only after the provider publishes a verified game frame.</p>
              </div>`;
          }
          """
          replace_once(upcoming, upcoming + """
          function renderMissingGame(event: ScheduleEvent): void {
            if (event.series.state !== 'live' && event.series.state !== 'paused') {
              renderUpcoming(event);
              return;
            }
            renderedGameId = null;
            clearLiveClock();
            gameContent.innerHTML = `
              <div class=\"analysis-empty\">
                <span class=\"analysis-empty-icon\" aria-hidden=\"true\">↻</span>
                <h3>Waiting for the game feed</h3>
                <p>Riot has marked this series ${escapeHtml(event.series.state)} but has not published a usable game ID yet. The board will recover automatically.</p>
              </div>`;
          }
          """)

          replace_once(
              """  const event = currentEvent();
            const game = event ? selectedGame(event) : null;
            if (!event || !game) return;
          """,
              """  const event = currentEvent();
            const game = event ? selectedGame(event) : null;
            if (!event) return;
            if (!game) {
              renderMissingGame(event);
              return;
            }
          """
          )

          source = source.replace("else renderUpcoming(event);", "else renderMissingGame(event);")
          if source.count("else renderMissingGame(event);") != 2:
              raise SystemExit('expected two missing-game fallback call sites')

          replace_once(
              """    events = payload.events.filter(isActiveListing).sort((left, right) => {
                const liveDifference = Number(right.series.state === 'live') - Number(left.series.state === 'live');
                return liveDifference || Date.parse(left.series.scheduledStart) - Date.parse(right.series.scheduledStart);
              });
          """,
              """    const activeEvents = payload.events.filter(isActiveListing).sort((left, right) => {
                const liveDifference = Number(right.series.state === 'live') - Number(left.series.state === 'live');
                return liveDifference || Date.parse(left.series.scheduledStart) - Date.parse(right.series.scheduledStart);
              });
              events = await Promise.all(activeEvents.map(hydrateMissingGames));
          """
          )

          path.write_text(source)

          styles = Path('apps/web/src/styles.css')
          styles.write_text(styles.read_text() + """

          /* missing-live-game-fallback */
          .game-selector-empty {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 12px;
            color: #9eacbd;
            font-size: 0.66rem;
            font-weight: 750;
            letter-spacing: 0.03em;
          }
          """)

          for marker in ['hydrateMissingGames', 'Waiting for the game feed', 'Game feed pending', 'Promise.all(activeEvents.map(hydrateMissingGames))']:
              if marker not in path.read_text():
                  raise SystemExit(f'missing marker: {marker}')
          if 'missing-live-game-fallback' not in styles.read_text():
              raise SystemExit('missing fallback styles')
          PY
      - name: Validate repository
        run: |
          npm install --no-package-lock
          npm run check
          npm run build:web
        env:
          VITE_API_BASE_URL: https://esports-live-api.acchtt.workers.dev
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-empty-live-board.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/main.ts apps/web/src/styles.css .github/workflows/fix-empty-live-board.yml
          git commit -m "Recover empty live match boards"
          git push origin HEAD:agent/fix-empty-live-board
