name: Fix ended match winners

on:
  push:
    branches:
      - agent/fix-ended-match-winners

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Preserve observed official winners
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          provider = 'packages/adapter-lol/src/riot-consistent-provider.ts'
          winner_counts = '''function winnerCounts(games: readonly SeriesGameHistoryRef[], teams: readonly TeamRef[]): [number, number] {
            return [
              games.filter(game => game.winner?.id === teams[0]?.id).length,
              games.filter(game => game.winner?.id === teams[1]?.id).length
            ];
          }
          '''
          observed_history = winner_counts + '''
          const HISTORY_STATE_RANK: Record<SeriesGameHistoryRef['state'], number> = {
            unknown: 0,
            unstarted: 1,
            draft: 2,
            live: 3,
            paused: 3,
            completed: 4
          };

          export function mergeObservedSeriesHistory(
            previous: SeriesHistoryRef | undefined,
            incoming: SeriesHistoryRef
          ): SeriesHistoryRef {
            if (!previous) return reconcileSeriesHistory(incoming);

            const previousById = new Map(previous.games.map(game => [game.id, game]));
            const previousByNumber = new Map(previous.games.map(game => [game.number, game]));
            const score = [
              {
                team: incoming.score[0].team,
                wins: Math.max(previous.score[0]?.wins ?? 0, incoming.score[0].wins)
              },
              {
                team: incoming.score[1].team,
                wins: Math.max(previous.score[1]?.wins ?? 0, incoming.score[1].wins)
              }
            ] as const;
            let games = incoming.games.map(game => {
              const old = previousById.get(game.id) ?? previousByNumber.get(game.number);
              if (!old) return { ...game };
              return {
                ...game,
                state: HISTORY_STATE_RANK[old.state] > HISTORY_STATE_RANK[game.state]
                  ? old.state
                  : game.state,
                blueTeam: game.blueTeam ?? old.blueTeam,
                redTeam: game.redTeam ?? old.redTeam,
                winner: game.winner ?? old.winner,
                durationSeconds: game.durationSeconds ?? old.durationSeconds
              };
            });
            for (const old of previous.games) {
              if (!games.some(game => game.id === old.id || game.number === old.number)) games.push({ ...old });
            }
            games = games.sort((left, right) => left.number - right.number);

            const previousCompleted = new Set(
              previous.games.filter(game => game.state === 'completed').map(game => game.id)
            );
            const newlyCompleted = games.filter(
              game => game.state === 'completed' && !previousCompleted.has(game.id)
            );
            const leftDelta = score[0].wins - (previous.score[0]?.wins ?? score[0].wins);
            const rightDelta = score[1].wins - (previous.score[1]?.wins ?? score[1].wins);
            if (newlyCompleted.length === 1 && !newlyCompleted[0]!.winner) {
              const winner = leftDelta === 1 && rightDelta === 0
                ? score[0].team
                : rightDelta === 1 && leftDelta === 0
                  ? score[1].team
                  : null;
              if (winner) {
                const gameId = newlyCompleted[0]!.id;
                games = games.map(game => game.id === gameId ? { ...game, winner } : game);
              }
            }

            return reconcileSeriesHistory({ ...incoming, score: [...score], games });
          }
          '''
          replace_once(provider, winner_counts, observed_history)
          replace_once(
              provider,
              '''  const detailCache = new Map<string, DetailItemsCacheEntry>();
          ''',
              '''  const detailCache = new Map<string, DetailItemsCacheEntry>();
            const latestHistories = new Map<string, SeriesHistoryRef>();
          '''
          )
          replace_once(
              provider,
              '''    async getSeriesContext(seriesId: string): Promise<LolProviderSeriesContext> {
                const context = await base.getSeriesContext!(seriesId);
                return context.history
                  ? { ...context, history: reconcileSeriesHistory(context.history) }
                  : context;
              }
          ''',
              '''    async getSeriesContext(seriesId: string): Promise<LolProviderSeriesContext> {
                const context = await base.getSeriesContext!(seriesId);
                if (!context.history) return context;
                const history = mergeObservedSeriesHistory(latestHistories.get(seriesId), context.history);
                latestHistories.set(seriesId, history);
                return { ...context, history };
              }
          '''
          )

          tests = 'packages/adapter-lol/src/riot-consistent-provider.test.ts'
          replace_once(
              tests,
              "import { mergeMonotonicSnapshot, reconcileSeriesHistory } from './riot-consistent-provider.ts';\n",
              "import { mergeMonotonicSnapshot, mergeObservedSeriesHistory, reconcileSeriesHistory } from './riot-consistent-provider.ts';\n"
          )
          test_file = Path(tests)
          test_text = test_file.read_text()
          test_text += '''

          test('official score transitions preserve every observed completed-game winner', () => {
            const first = mergeObservedSeriesHistory(undefined, history([1, 0], 1));
            const second = mergeObservedSeriesHistory(first, history([1, 1], 2));
            const final = mergeObservedSeriesHistory(second, history([2, 1], 3));
            assert.deepEqual(final.games.map(game => game.winner?.id), ['left', 'right', 'left']);
          });

          test('first-seen split series keeps ambiguous early winners unresolved', () => {
            const merged = mergeObservedSeriesHistory(undefined, history([2, 1], 3));
            assert.deepEqual(merged.games.map(game => game.winner?.id ?? null), [null, null, 'left']);
          });
          '''
          test_file.write_text(test_text)

          web = 'apps/web/src/completed-matches-view.ts'
          replace_once(
              web,
              '''interface CachedContext {
                expiresAt: number;
                value: SeriesContext;
              }
          ''',
              '''interface CachedContext {
                expiresAt: number;
                value: SeriesContext;
              }

              interface StoredHistoryState {
                score: [number, number];
                completed: string[];
                winners: Record<string, string>;
              }
          '''
          )
          replace_once(
              web,
              '''const contextCache = new Map<string, CachedContext>();
          ''',
              '''const contextCache = new Map<string, CachedContext>();

              function storedHistoryKey(seriesId: string): string {
                return `esports-live:history:${seriesId}`;
              }

              function applyStoredWinners(seriesId: string, history: SeriesHistoryRef): SeriesHistoryRef {
                let stored: StoredHistoryState | null = null;
                try {
                  const value = localStorage.getItem(storedHistoryKey(seriesId));
                  stored = value ? JSON.parse(value) as StoredHistoryState : null;
                } catch {}

                const teams = history.score.map(entry => entry.team);
                const winners = { ...(stored?.winners ?? {}) };
                const games = history.games.map(game => {
                  if (game.winner) {
                    winners[game.id] = game.winner.id;
                    return game;
                  }
                  const winnerId = winners[game.id];
                  const winner = teams.find(team => team.id === winnerId) ?? null;
                  return winner ? { ...game, winner } : game;
                });
                try {
                  localStorage.setItem(storedHistoryKey(seriesId), JSON.stringify({
                    score: [history.score[0].wins, history.score[1].wins],
                    completed: games.filter(game => game.state === 'completed').map(game => game.id),
                    winners
                  } satisfies StoredHistoryState));
                } catch {}
                return { ...history, games };
              }
          '''
          )
          replace_once(
              web,
              '''          const context = await contextFor(event.series.id);
                        const match = context.history && isEnded(event, context.history)
                          ? { event, context, history: context.history } satisfies CompletedMatch
                          : null;
          ''',
              '''          const context = await contextFor(event.series.id);
                        const history = context.history
                          ? applyStoredWinners(event.series.id, context.history)
                          : null;
                        const match = history && isEnded(event, history)
                          ? { event, context: { ...context, history }, history } satisfies CompletedMatch
                          : null;
          '''
          )

          for path, markers in {
              provider: ['mergeObservedSeriesHistory', 'latestHistories'],
              tests: ['official score transitions preserve every observed completed-game winner'],
              web: ['applyStoredWinners', 'StoredHistoryState'],
          }.items():
              text = Path(path).read_text()
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'{path}: missing {marker}')
          PY

      - name: Validate
        run: |
          npm install --no-package-lock
          npm run check
          npm run build:web

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-ended-match-winners.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/adapter-lol/src/riot-consistent-provider.ts packages/adapter-lol/src/riot-consistent-provider.test.ts apps/web/src/completed-matches-view.ts .github/workflows/fix-ended-match-winners.yml
          git commit -m "Preserve observed ended-match winners"
          git push origin HEAD:agent/fix-ended-match-winners
