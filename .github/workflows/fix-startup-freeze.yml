name: Fix startup freeze

on:
  push:
    branches:
      - agent/fix-startup-freeze

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove eager startup preloads
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str = '') -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/web/src/completed-matches-view.ts',
              'const BACKGROUND_RESULTS_DELAY_MS = 250;\n'
          )
          replace_once(
              'apps/web/src/completed-matches-view.ts',
              "window.setTimeout(() => void loadCompletedMatches(), BACKGROUND_RESULTS_DELAY_MS);\n\n"
          )

          replace_once(
              'apps/web/src/completed-match-stats-view.ts',
              'const PREFETCH_MATCH_LIMIT = 2;\n'
          )
          replace_once(
              'apps/web/src/completed-match-stats-view.ts',
              'const prefetchedSeries = new Set<string>();\n'
          )
          replace_once(
              'apps/web/src/completed-match-stats-view.ts',
              '''async function prefetchSeries(seriesId: string): Promise<void> {
            if (prefetchedSeries.has(seriesId)) return;
            prefetchedSeries.add(seriesId);
            try {
              const context = await contextFor(seriesId);
              const games = context.history?.games.filter(game => game.state === 'completed') ?? [];
              await mapWithConcurrency(games, MAX_CONCURRENCY, game => snapshotFor(game.id));
            } catch {
              prefetchedSeries.delete(seriesId);
            }
          }

          function prefetchVisibleSeries(): void {
            const ids = [...resultsList.querySelectorAll<HTMLElement>('[data-completed-series-id]')]
              .map(card => card.dataset.completedSeriesId)
              .filter((value): value is string => Boolean(value))
              .slice(0, PREFETCH_MATCH_LIMIT);
            ids.forEach(seriesId => void prefetchSeries(seriesId));
          }

          '''
          )
          replace_once(
              'apps/web/src/completed-match-stats-view.ts',
              '''const observer = new MutationObserver(() => {
            syncSelectedSeries();
            prefetchVisibleSeries();
          });
          observer.observe(resultsList, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
          syncSelectedSeries();
          prefetchVisibleSeries();
          ''',
              '''const observer = new MutationObserver(syncSelectedSeries);
          observer.observe(resultsList, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
          syncSelectedSeries();
          '''
          )

          replace_once(
              'apps/web/src/main.ts',
              'const COMPLETED_PREFETCH_CONCURRENCY = 2;\n'
          )
          replace_once(
              'apps/web/src/main.ts',
              '''async function prefetchCompletedGames(event: ScheduleEvent): Promise<void> {
            const games = event.series.games.filter(game => game.state === 'completed');
            if (!games.length) return;
            let cursor = 0;
            const workers = Array.from(
              { length: Math.min(COMPLETED_PREFETCH_CONCURRENCY, games.length) },
              async () => {
                while (cursor < games.length) {
                  const game = games[cursor++];
                  if (!game) continue;
                  try { await completedSnapshotFor(game.id); } catch {}
                }
              }
            );
            await Promise.all(workers);
          }

          '''
          )
          replace_once('apps/web/src/main.ts', '  void prefetchCompletedGames(event);\n')
          replace_once('apps/web/src/main.ts', '  void prefetchCompletedGames(event);\n')
          replace_once(
              'apps/web/src/main.ts',
              '    void Promise.all(events.slice(0, 3).map(event => prefetchCompletedGames(event)));\n'
          )

          checks = {
              'apps/web/src/completed-matches-view.ts': ['BACKGROUND_RESULTS_DELAY_MS'],
              'apps/web/src/completed-match-stats-view.ts': ['prefetchVisibleSeries', 'prefetchSeries'],
              'apps/web/src/main.ts': ['prefetchCompletedGames', 'COMPLETED_PREFETCH_CONCURRENCY'],
          }
          for path, forbidden in checks.items():
              text = Path(path).read_text()
              for value in forbidden:
                  if value in text:
                      raise SystemExit(f'{path}: eager preload marker remains: {value}')
          PY

      - name: Validate
        shell: bash
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run check

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-startup-freeze.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/main.ts apps/web/src/completed-matches-view.ts apps/web/src/completed-match-stats-view.ts .github/workflows/fix-startup-freeze.yml
          git commit -m "Stop eager startup preloads"
          git push origin HEAD:agent/fix-startup-freeze
