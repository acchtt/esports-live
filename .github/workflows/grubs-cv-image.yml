name: Grubs CV Image

on:
  push:
    branches: [mobile-demo]
    paths:
      - 'services/grubs-cv/**'
      - '.github/workflows/grubs-cv-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test service primitives
        run: node --test services/grubs-cv/*.test.mjs

      - name: Prepare image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-grubs-cv" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:mobile-demo" \
            services/grubs-cv

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:mobile-demo"
