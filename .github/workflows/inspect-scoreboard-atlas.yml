name: Inspect Scoreboard Atlas

on:
  pull_request:
    paths:
      - .github/workflows/inspect-scoreboard-atlas.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/broadcast-objective-icons-no-side-gold
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pillow
      - name: Build labeled atlas sheets
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          source = Image.open('apps/web/public/objectives-scoreboard-source/scoreboardatlas.png').convert('RGBA')
          tile = 64
          cols = source.width // tile
          rows = source.height // tile
          out = Path('atlas-inspection')
          out.mkdir()
          font = ImageFont.load_default()
          scale = 3
          per_sheet_rows = 2
          for sheet_start in range(0, rows, per_sheet_rows):
              sheet_rows = min(per_sheet_rows, rows - sheet_start)
              canvas = Image.new('RGBA', (cols * tile * scale, sheet_rows * tile * scale), (8, 14, 27, 255))
              draw = ImageDraw.Draw(canvas)
              for y in range(sheet_start, sheet_start + sheet_rows):
                  for x in range(cols):
                      crop = source.crop((x*tile, y*tile, (x+1)*tile, (y+1)*tile))
                      bg = Image.new('RGBA', crop.size, (25, 34, 50, 255))
                      bg.alpha_composite(crop)
                      bg = bg.resize((tile*scale, tile*scale), Image.Resampling.NEAREST)
                      px = x * tile * scale
                      py = (y-sheet_start) * tile * scale
                      canvas.alpha_composite(bg, (px, py))
                      label = f'{y}:{x}'
                      draw.rectangle((px, py, px+34, py+12), fill=(0,0,0,210))
                      draw.text((px+2, py+1), label, font=font, fill=(255,255,255,255))
              canvas.convert('RGB').save(out / f'sheet-{sheet_start:02d}.jpg', quality=94)
          print(source.size, cols, rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scoreboard-atlas-inspection
          path: atlas-inspection
          retention-days: 1
