name: Refine Role Scoreboard Once

on:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/role-gold-scoreboard
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Improve medium-width layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/styles.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* role-gold-scoreboard-redesign */'
          start = text.index(marker)
          prefix, section = text[:start], text[start:]
          old = '''@media (max-width: 1120px) {
  .role-team-summary-grid,
  .role-matchup-row,
  .role-objective-comparison {
    grid-template-columns: minmax(0, 1fr) 126px minmax(0, 1fr);
  }

  .role-team-summary {
    grid-template-columns: 36px minmax(0, 1fr);
  }

  .role-team-summary.red {
    grid-template-columns: minmax(0, 1fr) 36px;
  }
'''
          new = '''@media (max-width: 1320px) {
  .role-team-summary-grid,
  .role-matchup-row,
  .role-objective-comparison {
    grid-template-columns: minmax(0, 1fr) 126px minmax(0, 1fr);
  }

  .role-team-summary {
    grid-template-columns: 36px minmax(0, 1fr);
  }

  .role-team-summary.red {
    grid-template-columns: minmax(0, 1fr) 36px;
  }

  .role-team-summary.red > img,
  .role-team-summary.red > .team-placeholder {
    grid-column: 2;
  }

  .role-team-summary.red .role-team-name {
    grid-column: 1;
  }
'''
          if old not in section:
              raise SystemExit('Expected medium-width role scoreboard block was not found')
          section = section.replace(old, new, 1)
          path.write_text(prefix + section, encoding='utf-8')
          PY
      - run: npm install
      - run: npm run check
      - name: Build web application
        run: npm run build:web
        env:
          VITE_API_BASE_URL: https://esports-live-api.acchtt.workers.dev
      - name: Validate responsive markers
        run: |
          grep -R '@media (max-width: 1320px)' apps/web/src/styles.css
          grep -R 'role-team-summary.red > img' apps/web/src/styles.css
      - name: Commit refinement
        run: |
          rm -f .github/workflows/refine-role-scoreboard-once.yml
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine role scoreboard responsive layout"
          git push origin HEAD:feature/role-gold-scoreboard
