name: Resolve Demo Conflict

on:
  push:
    branches:
      - demo
    paths:
      - .github/workflows/resolve-demo-conflict.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-demo-conflict
  cancel-in-progress: false

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out demo
        uses: actions/checkout@v6
        with:
          ref: demo
          fetch-depth: 0

      - name: Merge main and preserve resolved Worker composition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp apps/api/src/worker.ts /tmp/demo-worker.ts
          git fetch origin main

          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^apps/api/src/worker.ts$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi

            cp /tmp/demo-worker.ts apps/api/src/worker.ts
            git add apps/api/src/worker.ts
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit -m "Merge main into demo and resolve worker conflict"
          git push origin HEAD:demo
