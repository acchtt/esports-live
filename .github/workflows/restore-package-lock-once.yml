name: Restore Package Lock Once

on:
  pull_request:
    paths:
      - .github/workflows/restore-package-lock-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  restore-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore unchanged lockfile
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json
          rm .github/workflows/restore-package-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore unchanged package lock"
          git push origin HEAD:${{ github.head_ref }}
