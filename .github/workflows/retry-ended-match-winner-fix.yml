name: Retry ended match winner fix

on:
  pull_request:
    paths:
      - .github/workflows/retry-ended-match-winner-fix.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.head_ref == 'agent/fix-ended-match-winners' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-ended-match-winners
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/fix-ended-match-winners.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script[:script.index("\nweb = 'apps/web/src/completed-matches-view.ts'")], '<provider-patch>', 'exec'))

          path = Path('apps/web/src/completed-matches-view.ts')
          text = path.read_text()

          interface_marker = textwrap.dedent('''\
          interface CachedContext {
            expiresAt: number;
            value: SeriesContext;
          }
          ''')
          interface_replacement = interface_marker + textwrap.dedent('''\

          interface StoredHistoryState {
            score: [number, number];
            completed: string[];
            winners: Record<string, string>;
          }
          ''')
          if text.count(interface_marker) != 1:
              raise SystemExit(f'CachedContext marker count: {text.count(interface_marker)}')
          text = text.replace(interface_marker, interface_replacement, 1)

          cache_marker = 'const contextCache = new Map<string, CachedContext>();\n'
          helper = textwrap.dedent('''\
          const contextCache = new Map<string, CachedContext>();

          function storedHistoryKey(seriesId: string): string {
            return `esports-live:history:${seriesId}`;
          }

          function applyStoredWinners(seriesId: string, history: SeriesHistoryRef): SeriesHistoryRef {
            let stored: StoredHistoryState | null = null;
            try {
              const value = localStorage.getItem(storedHistoryKey(seriesId));
              stored = value ? JSON.parse(value) as StoredHistoryState : null;
            } catch {}

            const teams = history.score.map(entry => entry.team);
            const winners = { ...(stored?.winners ?? {}) };
            const games = history.games.map(game => {
              if (game.winner) {
                winners[game.id] = game.winner.id;
                return game;
              }
              const winnerId = winners[game.id];
              const winner = teams.find(team => team.id === winnerId) ?? null;
              return winner ? { ...game, winner } : game;
            });
            try {
              localStorage.setItem(storedHistoryKey(seriesId), JSON.stringify({
                score: [history.score[0].wins, history.score[1].wins],
                completed: games.filter(game => game.state === 'completed').map(game => game.id),
                winners
              } satisfies StoredHistoryState));
            } catch {}
            return { ...history, games };
          }
          ''')
          if text.count(cache_marker) != 1:
              raise SystemExit(f'context cache marker count: {text.count(cache_marker)}')
          text = text.replace(cache_marker, helper, 1)

          pattern = re.compile(
              r"(?P<indent>\s*)const context = await contextFor\(event\.series\.id\);\n"
              r"(?P=indent)const match = context\.history && isEnded\(event, context\.history\)\n"
              r"(?P=indent)  \? \{ event, context, history: context\.history \} satisfies CompletedMatch\n"
              r"(?P=indent)  : null;"
          )
          replacement = textwrap.dedent('''\
          const context = await contextFor(event.series.id);
          const history = context.history
            ? applyStoredWinners(event.series.id, context.history)
            : null;
          const match = history && isEnded(event, history)
            ? { event, context: { ...context, history }, history } satisfies CompletedMatch
            : null;''')
          match = pattern.search(text)
          if not match:
              raise SystemExit('completed match context block not found')
          indent = match.group('indent')
          replacement = '\n'.join(indent + line if line else line for line in replacement.splitlines())
          text = pattern.sub(replacement, text, count=1)
          path.write_text(text)

          checks = {
              'packages/adapter-lol/src/riot-consistent-provider.ts': ['mergeObservedSeriesHistory', 'latestHistories'],
              'packages/adapter-lol/src/riot-consistent-provider.test.ts': ['official score transitions preserve every observed completed-game winner'],
              'apps/web/src/completed-matches-view.ts': ['applyStoredWinners', 'StoredHistoryState'],
          }
          for filename, markers in checks.items():
              value = Path(filename).read_text()
              for required in markers:
                  if required not in value:
                      raise SystemExit(f'{filename}: missing {required}')
          PY

      - name: Validate
        run: |
          npm install --no-package-lock
          npm run check
          npm run build:web

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-ended-match-winners.yml
          rm .github/workflows/run-ended-match-winner-fix.yml
          rm .github/workflows/retry-ended-match-winner-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/adapter-lol/src/riot-consistent-provider.ts packages/adapter-lol/src/riot-consistent-provider.test.ts apps/web/src/completed-matches-view.ts .github/workflows/fix-ended-match-winners.yml .github/workflows/run-ended-match-winner-fix.yml .github/workflows/retry-ended-match-winner-fix.yml
          git commit -m "Preserve observed ended-match winners"
          git push origin HEAD:agent/fix-ended-match-winners
