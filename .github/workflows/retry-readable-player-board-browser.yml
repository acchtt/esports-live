name: Retry readable player board browser

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/readable-player-board'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/readable-player-board
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-readable-player-board.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          script = script.replace(
              "main_path: ['objective-label', \"cell('Inhibitors'\", 'objective-icon'],",
              "main_path: ['objective-label', \"cell('Inhibitors'\"],"
          )
          exec(compile(script, '<readable-board-patch>', 'exec'))

          browser_marker = "          node --input-type=module - <<'NODE'\n"
          browser_start = workflow.index(browser_marker) + len(browser_marker)
          browser_end = workflow.index("\n          NODE", browser_start)
          browser_lines = workflow[browser_start:browser_end].splitlines()
          browser_script = '\n'.join(line[10:] if line.startswith('          ') else line for line in browser_lines)
          Path('.verify-readable-board.mjs').write_text(browser_script + '\n')
          PY

      - name: Install and validate
        run: |
          npm install --no-package-lock
          npm run check
          npm run build:web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Install browser verifier
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Verify board readability
        shell: bash
        run: |
          npx vite preview apps/web --host 127.0.0.1 --port 4173 --strictPort > /tmp/esports-live-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill $preview_pid 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/esports-live-preview.log
            exit 1
          fi
          node .verify-readable-board.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: readable-player-board-verification
          path: readable-player-board.png
          retention-days: 2

      - name: Commit fix
        shell: bash
        run: |
          rm .verify-readable-board.mjs
          rm .github/workflows/apply-readable-player-board.yml
          rm .github/workflows/retry-readable-player-board.yml
          rm .github/workflows/retry-readable-player-board-browser.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/main.ts apps/web/src/player-board-view.ts apps/web/src/styles.css .github/workflows/apply-readable-player-board.yml .github/workflows/retry-readable-player-board.yml .github/workflows/retry-readable-player-board-browser.yml
          git commit -m "Restore objective text and improve player board readability"
          git push origin HEAD:agent/readable-player-board
