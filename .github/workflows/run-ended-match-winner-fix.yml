name: Run ended match winner fix

on:
  pull_request:
    paths:
      - .github/workflows/run-ended-match-winner-fix.yml
      - .github/workflows/fix-ended-match-winners.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.head_ref == 'agent/fix-ended-match-winners' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-ended-match-winners
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/fix-ended-match-winners.yml').read_text()
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/fix-ended-match-winners.py').write_text(script + '\n')
          PY
          python /tmp/fix-ended-match-winners.py

      - name: Validate
        run: |
          npm install --no-package-lock
          npm run check
          npm run build:web

      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-ended-match-winners.yml
          rm .github/workflows/run-ended-match-winner-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/adapter-lol/src/riot-consistent-provider.ts packages/adapter-lol/src/riot-consistent-provider.test.ts apps/web/src/completed-matches-view.ts .github/workflows/fix-ended-match-winners.yml .github/workflows/run-ended-match-winner-fix.yml
          git commit -m "Preserve observed ended-match winners"
          git push origin HEAD:agent/fix-ended-match-winners
