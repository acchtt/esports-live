name: Verify Current Roster Lineups

on:
  pull_request:
    paths:
      - .github/workflows/verify-current-roster-lineups.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Verify current Riot roster isolation
        shell: bash
        run: |
          node --import tsx - <<'NODE'
          import { createRiotLolHistoryProvider } from './packages/adapter-lol/src/riot-history-provider.ts';

          const source = await fetch('https://raw.githubusercontent.com/Aureom/live-lol-esports/main/src/utils/LoLEsportsAPI.ts').then(response => response.text());
          const apiKey = source.match(/API_KEY\s*=\s*["']([^"']+)["']/)?.[1];
          if (!apiKey) throw new Error('Unable to resolve the public Riot web API key.');
          console.log(`::add-mask::${apiKey}`);

          const provider = createRiotLolHistoryProvider({ apiKey });
          const schedule = await provider.getSchedule();
          const priority = schedule
            .filter(entry => /LCK|LEC|LPL|LCS|CBLOL|NACL/i.test(entry.series.competition.name))
            .sort((left, right) => {
              const important = value => /T1|Gen\.G|Challengers|Academy|Youth|HLE|DK|FEARX/i.test(
                value.series.teams.map(team => team.name).join(' ')
              ) ? 0 : 1;
              return important(left) - important(right)
                || Math.abs(Date.parse(left.series.scheduledStart) - Date.now())
                  - Math.abs(Date.parse(right.series.scheduledStart) - Date.now());
            })
            .slice(0, 18);

          const canonical = new Set(['top', 'jungle', 'mid', 'bottom', 'support']);
          const reports = [];
          for (const entry of priority) {
            const context = await provider.getSeriesContext?.(entry.series.id);
            const rosters = context?.rosters ?? [];
            const rosterReports = rosters.map(roster => {
              const roles = roster.players.map(player => String(player.role ?? '').toLowerCase());
              const valid = roster.players.length === 0 || (
                roster.players.length === 5
                && new Set(roster.players.map(player => player.id)).size === 5
                && roles.every(role => canonical.has(role))
                && new Set(roles).size === 5
              );
              return {
                team: roster.team.name,
                teamId: roster.team.id,
                count: roster.players.length,
                valid,
                handles: roster.players.map(player => player.handle),
                roles
              };
            });
            reports.push({
              seriesId: entry.series.id,
              competition: entry.series.competition.name,
              teams: entry.series.teams.map(team => team.name),
              rosters: rosterReports,
              reasonCodes: context?.reasons?.map(reason => reason.code) ?? []
            });
          }

          const invalid = reports.flatMap(report => report.rosters
            .filter(roster => !roster.valid)
            .map(roster => ({ seriesId: report.seriesId, ...roster })));
          const forbiddenByTeam = [
            {
              pattern: /T1 Esports Academy/i,
              forbidden: ['Doran', 'Oner', 'Faker', 'Peyz', 'Keria']
            },
            {
              pattern: /^T1$/i,
              forbidden: ['Painter', 'Cypher', 'Guardian', 'Guti', 'Cloud', 'Eclipse', 'Haetae', 'Jinbeom']
            },
            {
              pattern: /HLE Challengers/i,
              forbidden: ['Kanavi', 'Gumayusi', 'Zeus', 'Zeka', 'Delight']
            },
            {
              pattern: /DK Challengers/i,
              forbidden: ['ShowMaker', 'Lucid', 'Siwoo']
            },
            {
              pattern: /FEARX Youth/i,
              forbidden: ['Clear', 'Raptor', 'Taeyoon', 'VicLa', 'Kellin']
            }
          ];
          const crossTier = [];
          for (const report of reports) {
            for (const roster of report.rosters) {
              for (const rule of forbiddenByTeam) {
                if (!rule.pattern.test(roster.team)) continue;
                const present = roster.handles.filter(handle => rule.forbidden.includes(handle));
                if (present.length) crossTier.push({ team: roster.team, present });
              }
            }
          }

          const requiredVerified = [
            /T1 Esports Academy/i,
            /DK Challengers/i,
            /HLE Challengers/i,
            /FEARX Youth/i
          ];
          const missingVerified = requiredVerified.flatMap(pattern => {
            const roster = reports.flatMap(report => report.rosters).find(item => pattern.test(item.team));
            return roster?.count === 5 ? [] : [{ teamPattern: pattern.source, roster: roster ?? null }];
          });

          console.log(`CURRENT_ROSTER_VERIFY=${JSON.stringify({
            checkedAt: new Date().toISOString(),
            scheduleCount: schedule.length,
            seriesChecked: reports.length,
            invalid,
            crossTier,
            missingVerified,
            reports
          })}`);
          if (invalid.length || crossTier.length || missingVerified.length) process.exit(1);
          NODE
