name: Verify LoL Context Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-lol-context-once.yml

permissions:
  contents: write

env:
  API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Probe production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_BASE_URL/health" > /tmp/health.json
          curl --fail --silent --show-error "$API_BASE_URL/v1/lol/schedule?limit=2" > /tmp/page1.json
          node - <<'NODE'
          const fs = require('node:fs');
          const page = JSON.parse(fs.readFileSync('/tmp/page1.json', 'utf8'));
          const seriesId = page.events?.[0]?.series?.id;
          if (!seriesId || !page.page) process.exit(1);
          fs.writeFileSync('/tmp/series-id.txt', seriesId);
          fs.writeFileSync('/tmp/next-cursor.txt', page.page.nextCursor ?? '');
          NODE
          series_id="$(cat /tmp/series-id.txt)"
          curl --fail --silent --show-error "$API_BASE_URL/v1/lol/series/$series_id/context" > /tmp/context.json
          cursor="$(cat /tmp/next-cursor.txt)"
          if [[ -n "$cursor" ]]; then
            curl --fail --silent --show-error --get \
              --data-urlencode "cursor=$cursor" \
              --data-urlencode "limit=2" \
              "$API_BASE_URL/v1/lol/schedule" > /tmp/page2.json
          else
            printf '{"events":[]}' > /tmp/page2.json
          fi
          curl --fail --silent --show-error https://esports-live.pages.dev > /tmp/web.html
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const first = JSON.parse(fs.readFileSync('/tmp/page1.json', 'utf8'));
          const second = JSON.parse(fs.readFileSync('/tmp/page2.json', 'utf8'));
          const context = JSON.parse(fs.readFileSync('/tmp/context.json', 'utf8'));
          const web = fs.readFileSync('/tmp/web.html', 'utf8');
          const result = {
            status: 'success',
            checkedAt: new Date().toISOString(),
            adapters: health.adapters ?? [],
            scheduleTotal: first.page?.total ?? null,
            firstPageCount: first.events?.length ?? null,
            secondPageCount: second.events?.length ?? null,
            firstSeriesId: first.events?.[0]?.series?.id ?? null,
            contextComplete: context.complete ?? null,
            rosterCount: context.rosters?.length ?? null,
            rosterPlayerCounts: context.rosters?.map(r => r.players?.length ?? 0) ?? [],
            standingsCount: context.standings?.length ?? null,
            reasonCodes: context.reasons?.map(r => r.code) ?? [],
            webHtmlPresent: /Esports Live/i.test(web)
          };
          fs.mkdirSync('.deployment', { recursive: true });
          fs.writeFileSync('.deployment/lol-context-verification.json', JSON.stringify(result, null, 2) + '\n');
          if (!result.adapters.includes('lol') || result.firstPageCount !== 2 || !result.webHtmlPresent) process.exit(1);
          NODE
      - name: Record verification
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .deployment/lol-context-verification.json
          git commit -m "Record LoL context verification"
          git push
