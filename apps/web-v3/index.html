<!doctype html>
<html lang="en" data-build-sha="%VITE_BUILD_SHA%" data-arena-version="v3">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06090d" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="ARENA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARENA" />
    <meta name="arena-version" content="v3" />
    <meta name="build-run" content="%VITE_BUILD_RUN%" />
    <meta name="build-time" content="%VITE_BUILD_TIME%" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./pwa/arena-icon.svg" />
    <title>ARENA</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #06090d; color: #f4f7fb; }
      #arena-startup-fallback { display: none; box-sizing: border-box; min-height: 100vh; padding: 96px 24px 32px; font: 600 16px/1.5 system-ui, sans-serif; }
      #arena-startup-fallback strong { display: block; margin-bottom: 8px; color: #00e5ff; font-size: 22px; }
      #arena-startup-fallback p { max-width: 34rem; margin: 0; color: #9da9bc; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <section id="arena-startup-fallback" role="alert">
      <strong>ARENA could not start</strong>
      <p>Please close and reopen the app. If this message remains, clear ARENA's app storage and install the latest update again.</p>
    </section>
    <script>
      window.setTimeout(function () {
        var app = document.getElementById('app');
        var fallback = document.getElementById('arena-startup-fallback');
        if (app && fallback && app.childElementCount === 0) fallback.style.display = 'block';
      }, 6000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
